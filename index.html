    return diversityBonusMap[count] || 0;
  }

  // 役割: 接続数字の重複に応じたペナルティを返す
  function getDuplicateNumberPenalty(hexInfos, duplicatePenaltyMap) {
    const numberCounts = {};

    hexInfos.forEach((info) => {
      if (info.number === null || typeof info.number === "undefined") {
        return;
      }
      numberCounts[info.number] = (numberCounts[info.number] || 0) + 1;
    });

    const maxDuplicateCount = Object.values(numberCounts).reduce((max, count) => Math.max(max, count), 0);
    if (maxDuplicateCount >= 3) {
      return duplicatePenaltyMap[3] || 0;
    }
    if (maxDuplicateCount >= 2) {
      return duplicatePenaltyMap[2] || 0;
    }
    return 0;
  }

  // 役割: 頂点に接する edge 一覧を返す
  function getAdjacentEdgesForVertex(vertexId, ctx) {
    return ctx.boardData.edges.filter((edge) => edge.v1 === vertexId || edge.v2 === vertexId);
  }

  // 役割: edge の反対側 vertexId を返す
  function getOtherVertexId(edge, vertexId) {
    if (!edge) return null;
    if (edge.v1 === vertexId) return edge.v2;
    if (edge.v2 === vertexId) return edge.v1;
    return null;
  }

  // 役割: 頂点に隣接する vertexId 一覧を返す
  function getAdjacentVertexIdsForVertex(vertexId, ctx) {
    return getAdjacentEdgesForVertex(vertexId, ctx)
      .map((edge) => getOtherVertexId(edge, vertexId))
      .filter((adjacentVertexId) => adjacentVertexId !== null);
  }

  // 役割: 頂点に建物があるかを返す
  function isVertexOccupied(vertexId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState && vertexState.buildingType !== null;
  }

  // 役割: 頂点が相手建物で塞がれているかを返す
  function isOpponentBuildingVertex(vertexId, playerId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState
      && vertexState.ownerPlayerId !== null
      && vertexState.ownerPlayerId !== playerId
      && vertexState.buildingType !== null;
  }

  // 役割: 頂点が自分建物かを返す
  function isPlayerBuildingVertex(vertexId, playerId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState
      && vertexState.ownerPlayerId === playerId
      && vertexState.buildingType !== null;
  }

  // 役割: 頂点に接する別 edge に自分の道があるかを返す
  function hasAdjacentPlayerRoad(vertexId, playerId, excludingEdgeId, ctx) {
    return getAdjacentEdgesForVertex(vertexId, ctx).some((edge) => {
      if (edge.id === excludingEdgeId) {
        return false;
      }
      const edgeState = ctx.edgeStates[edge.id];
      return !!edgeState && edgeState.ownerPlayerId === playerId;
    });
  }

  // 役割: 道候補 edge の端点が自分ネットワーク側かどうかを判定する
  function getRoadEndpointStatus(vertexId, edgeId, playerId, ctx) {
    const hasOpponentBuilding = isOpponentBuildingVertex(vertexId, playerId, ctx);
    const hasPlayerBuilding = isPlayerBuildingVertex(vertexId, playerId, ctx);
    const hasPlayerRoadConnection = hasAdjacentPlayerRoad(vertexId, playerId, edgeId, ctx);

    return {
      vertexId,
      hasOpponentBuilding,
      hasPlayerBuilding,
      hasPlayerRoadConnection,
      isNetworkSide: !hasOpponentBuilding && (hasPlayerBuilding || hasPlayerRoadConnection)
    };
  }

  // 役割: 将来の開拓地候補としてまだ死んでいない頂点かを判定する
  function isAliveFutureSettlementVertex(vertexId, playerId, ctx) {
    if (vertexId === null || typeof vertexId === "undefined") {
      return false;
    }

    const vertexState = ctx.vertexStates[vertexId];
    if (!vertexState) {
      return false;
    }

    if (vertexState.buildingType !== null) {
      return false;
    }

    return getAdjacentVertexIdsForVertex(vertexId, ctx).every((adjacentVertexId) => {
      const adjacentVertexState = ctx.vertexStates[adjacentVertexId];
      return !adjacentVertexState || adjacentVertexState.buildingType === null;
    });
  }

  // 役割: 道の先にある将来開拓地候補 1 点を簡易採点する
  // 使用: build_road と road_building の先読み評価時
  // 入出力: vertexId, playerId, ctx を受け取り、targetVertex の totalScore と breakdown か null を返す
  // 関連: isAliveFutureSettlementVertex / getVertexProductionProfile / scoreBuildRoadWithContext
  function evaluateRoadTargetVertex(vertexId, playerId, ctx) {
    if (!isAliveFutureSettlementVertex(vertexId, playerId, ctx)) {
      return null;
    }

    const profile = getVertexProductionProfile(vertexId, ctx);
    const pipScore = profile.pipScore;
    const resourceDiversityScore = getResourceDiversityScore(
      profile.hexInfos,
      SCORING_CONFIG.settlement.resourceDiversityBonus
    );
    const duplicateNumberPenalty = getDuplicateNumberPenalty(
      profile.hexInfos,
      SCORING_CONFIG.settlement.duplicateNumberPenalty
    );
    const totalScore = pipScore + resourceDiversityScore + duplicateNumberPenalty;

    return {
      vertexId,
      totalScore,
      breakdown: {
        pipScore,
        resourceDiversityScore,
        duplicateNumberPenalty
      }
    };
  }

  // 役割: 将来開拓地評価群から最良候補 1 件を返す
  function getBestRoadTargetEvaluation(evaluations) {
    return evaluations.reduce((best, current) => {
      if (!current) return best;
      if (!best) return current;
      return current.totalScore > best.totalScore ? current : best;
    }, null);
  }

  // 役割: 中継頂点から先に伸ばした時の将来候補頂点を集める
  function collectRoadCandidatesThroughMidpoint(midpointVertexId, edgeId, playerId, ctx) {
    if (isOpponentBuildingVertex(midpointVertexId, playerId, ctx)) {
      return [];
    }

    return getAdjacentEdgesForVertex(midpointVertexId, ctx)
      .filter((edge) => edge.id !== edgeId)
      .map((edge) => evaluateRoadTargetVertex(getOtherVertexId(edge, midpointVertexId), playerId, ctx))
      .filter(Boolean);
  }

  // 役割: 端点の接続種別に応じて道候補の将来評価対象を列挙する
  function collectRoadCandidatesFromEndpoint(sourceSide, oppositeSide, edgeId, playerId, ctx) {
    if (!sourceSide.isNetworkSide) {
      return [];
    }

    if (sourceSide.hasPlayerBuilding) {
      return collectRoadCandidatesThroughMidpoint(oppositeSide.vertexId, edgeId, playerId, ctx);
    }

    if (sourceSide.hasPlayerRoadConnection) {
      const directCandidate = evaluateRoadTargetVertex(oppositeSide.vertexId, playerId, ctx);
      return directCandidate ? [directCandidate] : [];
    }

    return [];
  }

  // 役割: 開拓地候補から空き edge 方向へ伸びる余地を expansionScore に変換する
  function getExpansionScore(vertexId, playerId, expansionBonusMap, ctx) {
    const validDirectionCount = getAdjacentEdgesForVertex(vertexId, ctx).reduce((count, edge) => {
      const edgeState = ctx.edgeStates[edge.id];
      if (!edgeState || edgeState.ownerPlayerId !== null) {
        return count;
      }

      const otherVertexId = getOtherVertexId(edge, vertexId);
      if (otherVertexId === null) {
        return count;
      }

      const otherVertexState = ctx.vertexStates[otherVertexId];
      if (!otherVertexState) {
        return count;
      }

      if (
        otherVertexState.ownerPlayerId !== null &&
        otherVertexState.ownerPlayerId !== playerId &&
        otherVertexState.buildingType !== null
      ) {
        return count;
      }

      return count + 1;
    }, 0);

    const cappedCount = Math.min(validDirectionCount, 3);
    return expansionBonusMap[cappedCount] || 0;
  }

  // 役割: 頂点の接続 hex 情報と基礎 pipScore をまとめて返す
  function getVertexProductionProfile(vertexId, ctx) {
    const hexInfos = getAdjacentHexInfosForVertex(vertexId, ctx);
    return {
      hexInfos,
      pipScore: getPipScoreFromHexInfos(hexInfos, SCORING_CONFIG.settlement.pipWeights)
    };
  }

  // 役割: 初期配置の 1 本目道路として edge を採点する
  // 使用: 初期配置検討ボタンから edge 候補を評価する時
  // 入出力: edgeId, playerId, originVertexId, ctx を受け取り、score と scoreBreakdown を返す
  // 関連: scoreInitialPlacementRoad / collectRoadCandidatesThroughMidpoint / SCORING_CONFIG.road
  function scoreRoadFromSettlementOrigin(edgeId, playerId, originVertexId, ctx) {
    if (!ctx || edgeId === null || originVertexId === null) {
      return createFixedScore(0);
    }

    const edge = ctx.boardData.edges[edgeId];
    if (!edge) {
      return createFixedScore(0);
    }

    if (edge.v1 !== originVertexId && edge.v2 !== originVertexId) {
      return createFixedScore(0);
    }

    const midpointVertexId = getOtherVertexId(edge, originVertexId);
    const evaluations = collectRoadCandidatesThroughMidpoint(midpointVertexId, edgeId, playerId, ctx);
    const bestEvaluation = getBestRoadTargetEvaluation(evaluations);
    const targetVertexScore = bestEvaluation ? bestEvaluation.totalScore : 0;
    const roadBonus = 0;
    const rawScore = targetVertexScore + roadBonus;
    const finalScore = clampScore(rawScore * SCORING_CONFIG.road.finalMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        roadCase: "from_settlement",
        originVertexId,
        midpointVertexId,
        targetVertexScore,
        roadBonus,
        rawScore,
        finalMultiplier: SCORING_CONFIG.road.finalMultiplier,
        evaluatedVertexId: bestEvaluation ? bestEvaluation.vertexId : null,
        candidateVertexCount: evaluations.length,
        targetVertexBreakdown: bestEvaluation ? bestEvaluation.breakdown : null
      }
    };
  }

  // 役割: 盗賊スコア用の出目係数を返す
  function getRobberDiceMultiplier(number) {
    if (number === null || typeof number === "undefined") {
      return 0;
    }

    return SCORING_CONFIG.robber.diceMultiplier[number] || 0;
  }

  // 役割: 通常手番の build_road 候補 1 件を採点する
  // 使用: actionCandidates の build_road 採点時、および road_building の仮盤面再計算時
  // 入出力: action, playerId, ctx を受け取り、score と scoreBreakdown を返す
  // 関連: scoreBuildRoad / evaluateRoadTargetVertex / SCORING_CONFIG.road / scoreAction
  function scoreBuildRoadWithContext(action, playerId, ctx) {
    const edgeId = getEdgeIdFromAction(action);
    if (!ctx || edgeId === null) {
      return createFixedScore(0);
    }

    const edge = ctx.boardData.edges[edgeId];
    if (!edge) {
      return createFixedScore(0);
    }

    const sideA = getRoadEndpointStatus(edge.v1, edgeId, playerId, ctx);
    const sideB = getRoadEndpointStatus(edge.v2, edgeId, playerId, ctx);
    const bothSidesAreNetwork = sideA.isNetworkSide && sideB.isNetworkSide;
    const oneSideHasRoad = sideA.hasPlayerRoadConnection || sideB.hasPlayerRoadConnection;
    const oneSideHasSettlement = sideA.hasPlayerBuilding || sideB.hasPlayerBuilding;

    let roadCase = "from_road";
    let roadBonus = 0;
    let evaluations = [];

    if (bothSidesAreNetwork) {
      roadCase = "network_connection";
      roadBonus = SCORING_CONFIG.road.networkConnectionBonus;
      evaluations = [
        ...collectRoadCandidatesFromEndpoint(sideA, sideB, edgeId, playerId, ctx),
        ...collectRoadCandidatesFromEndpoint(sideB, sideA, edgeId, playerId, ctx)
      ];
    } else if (oneSideHasRoad) {
      roadCase = "from_road";
      roadBonus = SCORING_CONFIG.road.extensionFromRoadBonus;
      const sourceSide = sideA.hasPlayerRoadConnection ? sideA : sideB;
      const oppositeSide = sourceSide === sideA ? sideB : sideA;
      evaluations = collectRoadCandidatesFromEndpoint(sourceSide, oppositeSide, edgeId, playerId, ctx);
    } else if (oneSideHasSettlement) {
      roadCase = "from_settlement";
      const sourceSide = sideA.hasPlayerBuilding ? sideA : sideB;
      const oppositeSide = sourceSide === sideA ? sideB : sideA;
      evaluations = collectRoadCandidatesFromEndpoint(sourceSide, oppositeSide, edgeId, playerId, ctx);
      if (hasAdjacentPlayerRoad(oppositeSide.vertexId, playerId, edgeId, ctx)) {
        roadBonus = SCORING_CONFIG.road.networkConnectionBonus;
      }
    }

    const bestEvaluation = getBestRoadTargetEvaluation(evaluations);
    const targetVertexScore = bestEvaluation ? bestEvaluation.totalScore : 0;
    const rawScore = targetVertexScore + roadBonus;
    const finalScore = clampScore(rawScore * SCORING_CONFIG.road.finalMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        roadCase,
        targetVertexScore,
        roadBonus,
        rawScore,
        finalMultiplier: SCORING_CONFIG.road.finalMultiplier,
        evaluatedVertexId: bestEvaluation ? bestEvaluation.vertexId : null,
        candidateVertexCount: evaluations.length,
        targetVertexBreakdown: bestEvaluation ? bestEvaluation.breakdown : null
      }
    };
  }

  // 役割: 現在盤面コンテキストで build_road を採点するラッパー
  function scoreBuildRoad(action, playerId) {
    const ctx = getScoringContext();
    return scoreBuildRoadWithContext(action, playerId, ctx);
  }

  // 役割: 初期配置検討用に originVertex 固定で道路候補を採点する
  function scoreInitialPlacementRoad(action, playerId, originVertexId) {
    const ctx = getScoringContext();
    const edgeId = getEdgeIdFromAction(action);
    return scoreRoadFromSettlementOrigin(edgeId, playerId, originVertexId, ctx);
  }

  // 役割: 通常手番の build_settlement 候補 1 件を採点する
  // 使用: actionCandidates の build_settlement 採点時と初期配置頂点評価の土台として
  // 入出力: action, playerId を受け取り、score と scoreBreakdown を返す
  // 関連: getVertexProductionProfile / getExpansionScore / SCORING_CONFIG.settlement / scoreAction
  function scoreBuildSettlement(action, playerId) {
    const ctx = getScoringContext();
    const vertexId = getVertexIdFromAction(action);
    if (!ctx || vertexId === null) {
      return createFixedScore(0);
    }

    const profile = getVertexProductionProfile(vertexId, ctx);
    const pipScore = profile.pipScore;
    const resourceDiversityScore = getResourceDiversityScore(
      profile.hexInfos,
      SCORING_CONFIG.settlement.resourceDiversityBonus
    );
    const duplicateNumberPenalty = getDuplicateNumberPenalty(
      profile.hexInfos,
      SCORING_CONFIG.settlement.duplicateNumberPenalty
    );
    const expansionScore = getExpansionScore(
      vertexId,
      playerId,
      SCORING_CONFIG.settlement.expansionBonus,
      ctx
    );
    const rawScore = pipScore + resourceDiversityScore + duplicateNumberPenalty + expansionScore;
    const finalScore = clampScore(rawScore * SCORING_CONFIG.settlement.finalMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        pipScore,
        resourceDiversityScore,
        duplicateNumberPenalty,
        expansionScore,
        rawScore,
        finalMultiplier: SCORING_CONFIG.settlement.finalMultiplier
      }
    };
  }

  // 役割: 通常手番の build_city 候補 1 件を採点する
  // 使用: actionCandidates の build_city 採点時
  // 入出力: action, playerId を受け取り、score と scoreBreakdown を返す
  // 関連: getVertexProductionProfile / SCORING_CONFIG.city / scoreAction
  function scoreBuildCity(action, playerId) {
    const ctx = getScoringContext();
    const vertexId = getVertexIdFromAction(action);
    if (!ctx || vertexId === null) {
      return createFixedScore(0);
    }

    const profile = getVertexProductionProfile(vertexId, ctx);
    const pipScore = profile.pipScore;
    const pipWeightMultiplier = SCORING_CONFIG.city.pipWeightMultiplier;
    const weightedPipScore = pipScore * pipWeightMultiplier;
    const resourceDiversityScore = getResourceDiversityScore(
      profile.hexInfos,
      SCORING_CONFIG.city.resourceDiversityBonus
    );
    const duplicateNumberPenalty = getDuplicateNumberPenalty(
      profile.hexInfos,
      SCORING_CONFIG.city.duplicateNumberPenalty
    );
    const rawScore = weightedPipScore + resourceDiversityScore + duplicateNumberPenalty;
    const finalScore = clampScore(rawScore * SCORING_CONFIG.city.finalMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        pipScore,
        pipWeightMultiplier,
        weightedPipScore,
        resourceDiversityScore,
        duplicateNumberPenalty,
        rawScore,
        finalMultiplier: SCORING_CONFIG.city.finalMultiplier
      }
    };
  }

  // 役割: 盗賊移動先 hex 候補を採点する
  // 使用: robberMode 中の CPU 最善手表示や robber 候補比較時
  // 入出力: action, playerId を受け取り、score と scoreBreakdown を返す
  // 関連: getHexIdFromAction / getRobberDiceMultiplier / SCORING_CONFIG.robber / scoreAction
  function scoreRobberMove(action, playerId) {
    const ctx = getScoringContext();
    const hexId = getHexIdFromAction(action);
    if (!ctx || hexId === null) {
      return {
        score: 0,
        scoreBreakdown: {
          baseScore: 0,
          diceMultiplier: 0,
          opponentSettlementCount: 0,
          opponentCityCount: 0,
          selfSettlementCount: 0,
          selfCityCount: 0,
          finalScore: 0,
          areaId: hexId,
          areaNumber: null
        }
      };
    }

    const hex = ctx.boardData.hexes.find((row) => row.id === hexId);
    const hexState = ctx.hexStates[hexId] || null;
    if (!hex || !hexState) {
      return {
        score: 0,
        scoreBreakdown: {
          baseScore: 0,
          diceMultiplier: 0,
          opponentSettlementCount: 0,
          opponentCityCount: 0,
          selfSettlementCount: 0,
          selfCityCount: 0,
          finalScore: 0,
          areaId: hexId,
          areaNumber: null
        }
      };
    }

    let baseScore = 0;
    let opponentSettlementCount = 0;
    let opponentCityCount = 0;
    let selfSettlementCount = 0;
    let selfCityCount = 0;

    hex.vertexIds.forEach((vertexId) => {
      const vertexState = ctx.vertexStates[vertexId];
      if (!vertexState || vertexState.ownerPlayerId === null || vertexState.buildingType === null) {
        return;
      }

      const isSelf = vertexState.ownerPlayerId === playerId;

      if (vertexState.buildingType === "city") {
        if (isSelf) {
          selfCityCount += 1;
          baseScore += SCORING_CONFIG.robber.selfCityPenalty;
        } else {
          opponentCityCount += 1;
          baseScore += SCORING_CONFIG.robber.opponentCityWeight;
        }
        return;
      }

      if (vertexState.buildingType === "settlement") {
        if (isSelf) {
          selfSettlementCount += 1;
          baseScore += SCORING_CONFIG.robber.selfSettlementPenalty;
        } else {
          opponentSettlementCount += 1;
          baseScore += SCORING_CONFIG.robber.opponentSettlementWeight;
        }
      }
    });

    const diceMultiplier = getRobberDiceMultiplier(hexState.number);
    const finalScore = roundScore(baseScore * diceMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        baseScore,
        diceMultiplier,
        opponentSettlementCount,
        opponentCityCount,
        selfSettlementCount,
        selfCityCount,
        finalScore,
        areaId: hexId,
        areaNumber: hexState.number ?? null
      }
    };
  }

  // 役割: 発展カード購入候補の固定値スコアを返す
  function scoreBuyDevCard(action, playerId) {
    return createFixedScore(SCORING_CONFIG.fixedActionScores.buyDevCard);
  }

  // 役割: do_nothing 候補の固定値スコアを返す
  function scoreDoNothing(action, playerId) {
    return createFixedScore(SCORING_CONFIG.fixedActionScores.doNothing);
  }

  // 役割: bank_trade 候補を目標行動スコアと交換倍率で採点する
  // 使用: 銀行交換候補生成後のスコア計算時
  // 入出力: bank_trade action と playerId を受け取り、score と scoreBreakdown を返す
  // 関連: buildBankTradeActions / SCORING_CONFIG.bankTrade / scoreAction
  function scoreBankTrade(action, playerId) {
    const tradeRate = Number(action?.tradeRate);
    const targetActionScore = typeof action?.targetActionScore === "number" ? action.targetActionScore : 0;
    const tradeRateMultiplier = SCORING_CONFIG.bankTrade.tradeRateMultiplier[tradeRate] || 0;
    const finalScore = clampScore(targetActionScore * tradeRateMultiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        targetActionScore,
        tradeRate,
        tradeRateMultiplier,
        finalScore,
        give: action?.give || [],
        get: action?.get || [],
        targetActionType: action?.targetActionType || null,
        targetTargetId: action?.targetTargetId || null
      }
    };
  }

  // 役割: 騎士カード使用候補の固定値スコアを返す
  function scoreUseKnight(action, playerId) {
    return createFixedScore(SCORING_CONFIG.fixedActionScores.useKnight);
  }

  // 役割: 街道建設カードの最良 2 本プランを score に変換する
  // 使用: use_road_building 候補の再評価時
  // 入出力: targetEdges と各道路 score を持つ action を受け取り、score と scoreBreakdown を返す
  // 関連: evaluateRoadBuildingActions / SCORING_CONFIG.roadBuilding / scoreAction
  function scoreUseRoadBuilding(action, playerId) {
    const firstRoadScore = typeof action?.firstRoadScore === "number" ? action.firstRoadScore : 0;
    const secondRoadScore = typeof action?.secondRoadScore === "number" ? action.secondRoadScore : 0;
    const firstRoadWeight = SCORING_CONFIG.roadBuilding.firstRoadWeight;
    const finalScore = clampScore(secondRoadScore + (firstRoadScore * firstRoadWeight));

    return {
      score: finalScore,
      scoreBreakdown: {
        targetEdges: action?.targetEdges || [],
        firstRoadScore,
        secondRoadScore,
        firstRoadWeight,
        finalScore,
        firstRoadEdgeId: action?.targetEdges?.[0] || null,
        secondRoadEdgeId: action?.targetEdges?.[1] || null
      }
    };
  }

  // 役割: 収穫カードで成立する目標行動スコアを倍率付きで評価する
  // 使用: use_year_of_plenty 候補の再評価時
  // 入出力: get / targetAction 情報を持つ action を受け取り、score と scoreBreakdown を返す
  // 関連: evaluateYearOfPlentyActions / SCORING_CONFIG.yearOfPlenty / scoreAction
  function scoreUseYearOfPlenty(action, playerId) {
    const targetActionScore = typeof action?.targetActionScore === "number" ? action.targetActionScore : 0;
    const multiplier = SCORING_CONFIG.yearOfPlenty.multiplier;
    const finalScore = clampScore(targetActionScore * multiplier);

    return {
      score: finalScore,
      scoreBreakdown: {
        targetActionScore,
        multiplier,
        finalScore,
        get: action?.get || [],
        targetActionType: action?.targetActionType || null,
        targetTargetId: action?.targetTargetId || null
      }
    };
  }

  // 役割: 相手全員が持つ資源枚数を資源別に合計する
  function getOpponentResourceCounts(playerId, ctx) {
    return MONOPOLY_RESOURCE_ORDER.reduce((counts, resourceKey) => {
      counts[resourceKey] = ctx.gameState.players.reduce((sum, player) => {
        if (!player || player.id === playerId) {
          return sum;
        }
        return sum + (player.resources?.[resourceKey] || 0);
      }, 0);
      return counts;
    }, {});
  }

  // 役割: 独占カードで最も多く奪える資源と見込み枚数を返す
  function getBestMonopolyTarget(playerId, ctx) {
    const resourceCountsByOpponents = getOpponentResourceCounts(playerId, ctx);
    let targetResource = MONOPOLY_RESOURCE_ORDER[0] || null;
    let expectedGain = targetResource ? (resourceCountsByOpponents[targetResource] || 0) : 0;

    MONOPOLY_RESOURCE_ORDER.forEach((resourceKey) => {
      const count = resourceCountsByOpponents[resourceKey] || 0;
      if (count > expectedGain) {
        targetResource = resourceKey;
        expectedGain = count;
      }
    });

    return {
      resourceCountsByOpponents,
      targetResource,
      expectedGain
    };
  }

  // 役割: 独占カード候補を相手資源合計から動的採点する
  // 使用: use_monopoly 候補の score / targetResource / expectedGain を決める時
  // 入出力: action, playerId を受け取り、targetResource と expectedGain を含む score 結果を返す
  // 関連: getOpponentResourceCounts / getBestMonopolyTarget / SCORING_CONFIG.monopoly / scoreAction
  function scoreUseMonopoly(action, playerId) {
    const ctx = getScoringContext();
    if (!ctx) {
      return {
        score: 0,
        targetResource: null,
        expectedGain: 0,
        scoreBreakdown: {
          resourceCountsByOpponents: {},
          targetResource: null,
          expectedGain: 0,
          gainValue: SCORING_CONFIG.monopoly.gainValue,
          finalScore: 0
        }
      };
    }

    const {
      resourceCountsByOpponents,
      targetResource,
      expectedGain
    } = getBestMonopolyTarget(playerId, ctx);
    const gainValue = SCORING_CONFIG.monopoly.gainValue;
    const finalScore = clampScore(expectedGain * gainValue);

    return {
      score: finalScore,
      targetResource,
      expectedGain,
      scoreBreakdown: {
        resourceCountsByOpponents,
        targetResource,
        expectedGain,
        gainValue,
        finalScore
      }
    };
  }

  // 役割: 勝利点カード公開候補の固定値スコアを返す
  function scoreUseVictoryPoint(action, playerId) {
    return createFixedScore(SCORING_CONFIG.fixedActionScores.useVictoryPoint);
  }

  // 役割: actionType ごとに採点関数を振り分ける共通入口
  // 使用: actionCandidates 全体のスコア計算時、各候補の score / scoreBreakdown 付与時
  // 入出力: action, playerId を受け取り、score と scoreBreakdown を返す
  // 関連: applyScoresToActions / scoreBuildRoad / scoreBuildSettlement / scoreBankTrade
  function scoreAction(action, playerId) {
    if (!action || !action.actionType) {
      return createFixedScore(0);
    }

    switch (action.actionType) {
      case "build_road":
        return scoreBuildRoad(action, playerId);
      case "build_settlement":
        return scoreBuildSettlement(action, playerId);
      case "build_city":
        return scoreBuildCity(action, playerId);
      case "move_robber":
        return scoreRobberMove(action, playerId);
      case "bank_trade":
        return scoreBankTrade(action, playerId);
      case "do_nothing":
        return scoreDoNothing(action, playerId);
      case "buy_dev_card":
        return scoreBuyDevCard(action, playerId);
      case "use_knight":
        return scoreUseKnight(action, playerId);
      case "use_road_building":
        return scoreUseRoadBuilding(action, playerId);
      case "use_year_of_plenty":
        return scoreUseYearOfPlenty(action, playerId);
      case "use_monopoly":
        return scoreUseMonopoly(action, playerId);
      case "use_victory_point":
        return scoreUseVictoryPoint(action, playerId);
      default:
        return createFixedScore(0);
    }
  }

  window.CatanScoring = {
    SCORING_CONFIG,
    scoreAction,
    scoreBuildRoadWithContext,
    scoreBuildRoad,
    scoreInitialPlacementRoad,
    scoreBuildSettlement,
    scoreBuildCity,
    scoreRobberMove,
    scoreBankTrade,
    scoreDoNothing,
    scoreBuyDevCard,
    scoreUseKnight,
    scoreUseRoadBuilding,
    scoreUseYearOfPlenty,
    scoreUseMonopoly,
    scoreUseVictoryPoint
  };
})();
</script>
<script>
(function () {
  const adjacencyCache = new WeakMap();
  const ACTION_RESOURCE_REQUIREMENTS = {
    build_road: {
      wood: 1,
      brick: 1
    },
    build_settlement: {
      wood: 1,
      brick: 1,
      sheep: 1,
      wheat: 1
    },
    build_city: {
      wheat: 2,
      ore: 3
    },
    buy_dev_card: {
      sheep: 1,
      wheat: 1,
      ore: 1
    },
    bank_trade: {},
    do_nothing: {},
    use_knight: {},
    use_road_building: {},
    use_year_of_plenty: {},
    use_monopoly: {},
    use_victory_point: {}
  };

  // 役割: CPU 補助側から catanCpuBridge を取得する
  function getBridge() {
    return window.catanCpuBridge || null;
  }

  // 役割: 盤面の vertex / edge 隣接関係をキャッシュ付きで組み立てる
  function getAdjacency(boardData) {
    if (adjacencyCache.has(boardData)) {
      return adjacencyCache.get(boardData);
    }

    const adjacentVertexIdsByVertex = boardData.vertices.map(() => []);
    const adjacentEdgeIdsByVertex = boardData.vertices.map(() => []);

    boardData.edges.forEach((edge) => {
      adjacentVertexIdsByVertex[edge.v1].push(edge.v2);
      adjacentVertexIdsByVertex[edge.v2].push(edge.v1);
      adjacentEdgeIdsByVertex[edge.v1].push(edge.id);
      adjacentEdgeIdsByVertex[edge.v2].push(edge.id);
    });

    const adjacency = {
      adjacentVertexIdsByVertex,
      adjacentEdgeIdsByVertex
    };

    adjacencyCache.set(boardData, adjacency);
    return adjacency;
  }

  // 役割: CPU 候補生成・素材判定・仮評価で使う共通 ctx を返す
  // 使用: 合法候補列挙、素材判定、銀行交換、カード評価などの入口で毎回参照する
  // 入出力: 引数なしで、boardData / gameState / state 配列 / adjacency を含む ctx または null を返す
  // 関連: getBridge / getLegalRoadCandidatesFromContext / buildActionCandidates / buildBankTradeActions
  function getCpuBoardContext() {
    const bridge = getBridge();
    if (!bridge || typeof bridge.getBoardData !== "function" || typeof bridge.getGameState !== "function") {
      return null;
    }

    const boardData = bridge.getBoardData();
    const gameState = bridge.getGameState();
    if (!boardData || !gameState || !gameState.boardState) {
      return null;
    }

    return {
      boardData,
      gameState,
      hexStates: gameState.boardState.hexStates || [],
      vertexStates: gameState.boardState.vertexStates || [],
      edgeStates: gameState.boardState.edgeStates || [],
      adjacency: getAdjacency(boardData)
    };
  }

  // 役割: 指定 vertex が空きかを返す
  function isEmptyVertex(vertexId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState && vertexState.ownerPlayerId === null && vertexState.buildingType === null;
  }

  // 役割: 指定 edge が空きかを返す
  function isEmptyEdge(edgeId, ctx) {
    const edgeState = ctx.edgeStates[edgeId];
    return !!edgeState && edgeState.ownerPlayerId === null;
  }

  // 役割: 指定 vertex が自分建物かを返す
  function isPlayerBuilding(vertexId, playerId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState && vertexState.ownerPlayerId === playerId && vertexState.buildingType !== null;
  }

  // 役割: 指定 vertex が相手建物かを返す
  function isOpponentBuilding(vertexId, playerId, ctx) {
    const vertexState = ctx.vertexStates[vertexId];
    return !!vertexState && vertexState.ownerPlayerId !== null && vertexState.ownerPlayerId !== playerId && vertexState.buildingType !== null;
  }

  // 役割: 指定 edge が自分の道かを返す
  function isPlayerRoad(edgeId, playerId, ctx) {
    const edgeState = ctx.edgeStates[edgeId];
    return !!edgeState && edgeState.ownerPlayerId === playerId;
  }

  // 役割: 指定 vertex に隣接する vertexId 一覧を返す
  function getAdjacentVertexIds(vertexId, ctx) {
    return ctx.adjacency.adjacentVertexIdsByVertex[vertexId] || [];
  }

  // 役割: 指定 vertex に接する edgeId 一覧を返す
  function getAdjacentEdgeIds(vertexId, ctx) {
    return ctx.adjacency.adjacentEdgeIdsByVertex[vertexId] || [];
  }

  // 役割: 距離ルール上、隣接 vertex に建物が無いかを返す
  function hasNoAdjacentBuildings(vertexId, ctx) {
    return getAdjacentVertexIds(vertexId, ctx).every((adjacentVertexId) => {
      const vertexState = ctx.vertexStates[adjacentVertexId];
      return !vertexState || vertexState.buildingType === null;
    });
  }

  // 役割: 指定 vertex に接する別 edge に自分の道があるかを返す
  function hasAdjacentPlayerRoad(vertexId, playerId, excludingEdgeId, ctx) {
    return getAdjacentEdgeIds(vertexId, ctx).some((edgeId) => {
      if (edgeId === excludingEdgeId) {
        return false;
      }
      return isPlayerRoad(edgeId, playerId, ctx);
    });
  }

  // 役割: 開拓地候補が自分の道に接続しているかを返す
  function isConnectedToPlayerRoad(vertexId, playerId, ctx) {
    return hasAdjacentPlayerRoad(vertexId, playerId, null, ctx);
  }

  // 役割: 道候補 edge が指定端点側から合法接続できるかを返す
  function isRoadConnectableFromVertex(vertexId, edgeId, playerId, ctx) {
    if (isOpponentBuilding(vertexId, playerId, ctx)) {
      return false;
    }

    if (isPlayerBuilding(vertexId, playerId, ctx)) {
      return true;
    }

    return hasAdjacentPlayerRoad(vertexId, playerId, edgeId, ctx);
  }

  // 役割: 現在盤面で playerId が置ける開拓地候補 vertexId を列挙する
  // 使用: build_settlement 候補生成時と合法候補ハイライト表示時
  // 入出力: playerId を受け取り、vertexId 配列を返す
  // 関連: isEmptyVertex / hasNoAdjacentBuildings / isConnectedToPlayerRoad / getLegalMoveCandidates
  function getLegalSettlementCandidates(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    return ctx.boardData.vertices
      .filter((vertex) => {
        if (!isEmptyVertex(vertex.id, ctx)) return false;
        if (!hasNoAdjacentBuildings(vertex.id, ctx)) return false;
        return isConnectedToPlayerRoad(vertex.id, playerId, ctx);
      })
      .map((vertex) => vertex.id);
  }

  // 役割: playerId が都市化できる vertexId を列挙する
  function getLegalCityCandidates(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    return ctx.boardData.vertices
      .filter((vertex) => {
        const vertexState = ctx.vertexStates[vertex.id];
        return !!vertexState
          && vertexState.ownerPlayerId === playerId
          && vertexState.buildingType === "settlement";
      })
      .map((vertex) => vertex.id);
  }

  // 役割: 現在盤面の ctx を使って道路候補列挙に委譲する
  function getLegalRoadCandidates(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    return getLegalRoadCandidatesFromContext(playerId, ctx);
  }

  // 役割: 指定 ctx 上で playerId の build_road 候補 edgeId を列挙する
  // 使用: 通常の道路候補生成時と road_building の仮盤面再計算時
  // 入出力: playerId, ctx を受け取り、edgeId 配列を返す
  // 関連: isEmptyEdge / isRoadConnectableFromVertex / createVirtualRoadBuildingContext / createBuildRoadActions
  function getLegalRoadCandidatesFromContext(playerId, ctx) {
    if (!ctx) return [];

    return ctx.boardData.edges
      .filter((edge) => {
        if (!isEmptyEdge(edge.id, ctx)) return false;
        return isRoadConnectableFromVertex(edge.v1, edge.id, playerId, ctx)
          || isRoadConnectableFromVertex(edge.v2, edge.id, playerId, ctx);
      })
      .map((edge) => edge.id);
  }

  // 役割: 道・開拓地・都市の合法候補をまとめて返す
  function getLegalMoveCandidates(playerId) {
    return {
      roadIds: getLegalRoadCandidates(playerId),
      settlementIds: getLegalSettlementCandidates(playerId),
      cityIds: getLegalCityCandidates(playerId)
    };
  }

  // 役割: ctx からプレイヤーを id 検索する
  function getPlayerById(playerId, ctx) {
    return ctx.gameState.players.find((player) => player.id === playerId) || null;
  }

  // 役割: actionType ごとの必要資材定義を返す
  function getActionResourceRequirements(actionType) {
    return { ...(ACTION_RESOURCE_REQUIREMENTS[actionType] || {}) };
  }

  // 役割: player または resources オブジェクトから資源プールを取り出す
  function getResourcePool(resourceSource) {
    if (!resourceSource) return {};
    if (resourceSource.resources && typeof resourceSource.resources === "object") {
      return resourceSource.resources;
    }
    return resourceSource;
  }

  // 役割: action 実行に不足している資源一覧を配列で返す
  function getMissingResourcesForAction(action, player) {
    const requirements = getActionResourceRequirements(action?.actionType);
    const playerResources = getResourcePool(player);
    const missingResources = [];

    Object.entries(requirements).forEach(([resourceType, requiredCount]) => {
      const ownedCount = playerResources[resourceType] || 0;
      const missingCount = Math.max(0, requiredCount - ownedCount);
      for (let i = 0; i < missingCount; i += 1) {
        missingResources.push(resourceType);
      }
    });

    return missingResources;
  }

  // 役割: action が今すぐ実行可能かと不足資源一覧を判定する
  // 使用: 素材判定ステップで全 action に canExecuteNow / missingResources を付ける時
  // 入出力: action, player または resources を受け取り、canExecuteNow と missingResources を返す
  // 関連: getMissingResourcesForAction / annotateExecutableActions / buildBankTradeActions / evaluateYearOfPlentyActions
  function evaluateActionExecutability(action, player) {
    const missingResources = getMissingResourcesForAction(action, player);
    return {
      canExecuteNow: missingResources.length === 0,
      missingResources
    };
  }

  // 役割: 5 資源セットを安全に複製する
  function cloneResources(resources) {
    return {
      wood: resources?.wood || 0,
      brick: resources?.brick || 0,
      sheep: resources?.sheep || 0,
      wheat: resources?.wheat || 0,
      ore: resources?.ore || 0
    };
  }

  // 役割: 資源名配列を {resource, amount} 配列へ集約する
  function aggregateResourceList(resourceList) {
    const counts = new Map();

    (resourceList || []).forEach((resource) => {
      counts.set(resource, (counts.get(resource) || 0) + 1);
    });

    return Array.from(counts.entries()).map(([resource, amount]) => ({ resource, amount }));
  }

  // 役割: 仮資源加算後の resources を返す
  function applyResourceGainToResources(resources, gainItems) {
    const nextResources = cloneResources(resources);

    (gainItems || []).forEach((item) => {
      if (!item || !item.resource) {
        return;
      }

      nextResources[item.resource] = (nextResources[item.resource] || 0) + (item.amount || 0);
    });

    return nextResources;
  }

  // 役割: actionCandidates に素材判定結果を付与する
  // 使用: 候補選出の直後、スコア計算前の共通ステップとして
  // 入出力: actions 配列と playerId を受け取り、canExecuteNow / missingResources 付き actions を返す
  // 関連: evaluateActionExecutability / buildActionCandidates / buildBankTradeActions
  function annotateExecutableActions(actions, playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) {
      return actions.map((action) => ({
        ...action,
        canExecuteNow: false,
        missingResources: []
      }));
    }

    const player = getPlayerById(playerId, ctx);
    return actions.map((action) => ({
      ...action,
      ...evaluateActionExecutability(action, player)
    }));
  }

  // 役割: actionCandidates 用の共通 action オブジェクトを作る
  function createAction(actionType, targetId = null, extra = {}) {
    return {
      actionType,
      targetId,
      canExecuteNow: null,
      missingResources: [],
      score: null,
      scoreBreakdown: null,
      ...extra
    };
  }

  // 役割: build_road action 群を作る
  function createBuildRoadActions(playerId) {
    return getLegalRoadCandidates(playerId).map((edgeId) => createAction("build_road", `e${edgeId}`));
  }

  // 役割: build_settlement action 群を作る
  function createBuildSettlementActions(playerId) {
    return getLegalSettlementCandidates(playerId).map((vertexId) => createAction("build_settlement", `v${vertexId}`));
  }

  // 役割: build_city action 群を作る
  function createBuildCityActions(playerId) {
    return getLegalCityCandidates(playerId).map((vertexId) => createAction("build_city", `v${vertexId}`));
  }

  // 役割: 初期配置用に距離ルールだけ満たす vertexId を列挙する
  function getInitialPlacementVertexCandidateIds() {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    return ctx.boardData.vertices
      .filter((vertex) => isEmptyVertex(vertex.id, ctx) && hasNoAdjacentBuildings(vertex.id, ctx))
      .map((vertex) => vertex.id);
  }

  // 役割: 初期配置向けの頂点候補を build_settlement 採点で評価する
  // 使用: 初期配置検討ボタン押下時
  // 入出力: playerId を受け取り、score 済み vertex action 配列を返す
  // 関連: getInitialPlacementVertexCandidateIds / applyScoresToActions / getBestInitialPlacementVertex
  function buildInitialPlacementVertexCandidates(playerId) {
    const actions = getInitialPlacementVertexCandidateIds().map((vertexId) => createAction(
      "build_settlement",
      `v${vertexId}`,
      {
        canExecuteNow: true,
        missingResources: []
      }
    ));

    return applyScoresToActions(actions, playerId);
  }

  // 役割: 初期配置頂点候補から最良 1 件を返す
  function getBestInitialPlacementVertex(playerId, vertexCandidates = null) {
    const candidates = Array.isArray(vertexCandidates)
      ? vertexCandidates
      : buildInitialPlacementVertexCandidates(playerId);

    if (!candidates.length) {
      return null;
    }

    return candidates.reduce((bestCandidate, candidate) => (
      !bestCandidate || candidate.score > bestCandidate.score ? candidate : bestCandidate
    ), null);
  }

  // 役割: 初期配置で origin vertex から出せる空き edgeId を列挙する
  function getInitialPlacementEdgeCandidateIds(vertexId) {
    const ctx = getCpuBoardContext();
    if (!ctx || !Number.isInteger(vertexId)) return [];

    return getAdjacentEdgeIds(vertexId, ctx).filter((edgeId) => isEmptyEdge(edgeId, ctx));
  }

  // 役割: 初期配置の 1 本目道路候補を仮評価する
  // 使用: 初期配置検討ボタンで最善 edge を出す時
  // 入出力: playerId, originVertexId を受け取り、score 済み edge action 配列を返す
  // 関連: getInitialPlacementEdgeCandidateIds / window.CatanScoring.scoreInitialPlacementRoad / getBestInitialPlacementEdge
  function buildInitialPlacementEdgeCandidates(playerId, originVertexId) {
    const edgeIds = getInitialPlacementEdgeCandidateIds(originVertexId);
    const actions = edgeIds.map((edgeId) => createAction(
      "build_road",
      `e${edgeId}`,
      {
        canExecuteNow: true,
        missingResources: []
      }
    ));

    const scoringApi = window.CatanScoring;
    if (!scoringApi || typeof scoringApi.scoreInitialPlacementRoad !== "function") {
      return actions.map((action) => ({
        ...action,
        score: 0,
        scoreBreakdown: { base: 0 }
      }));
    }

    return actions.map((action) => {
      const scored = scoringApi.scoreInitialPlacementRoad(action, playerId, originVertexId) || {};
      return {
        ...action,
        score: typeof scored.score === "number" ? scored.score : 0,
        scoreBreakdown: scored.scoreBreakdown || { base: 0 }
      };
    });
  }

  // 役割: 初期配置 edge 候補から最良 1 件を返す
  function getBestInitialPlacementEdge(playerId, originVertexId, edgeCandidates = null) {
    const candidates = Array.isArray(edgeCandidates)
      ? edgeCandidates
      : buildInitialPlacementEdgeCandidates(playerId, originVertexId);

    if (!candidates.length) {
      return null;
    }

    return candidates.reduce((bestCandidate, candidate) => (
      !bestCandidate || candidate.score > bestCandidate.score ? candidate : bestCandidate
    ), null);
  }

  // 役割: targetId 文字列から edgeId を取り出す
  function getEdgeIdFromActionTarget(targetId) {
    if (typeof targetId !== "string" || !targetId.startsWith("e")) {
      return null;
    }

    const edgeId = Number(targetId.slice(1));
    return Number.isInteger(edgeId) ? edgeId : null;
  }

  // 役割: 山札が残っている時だけ buy_dev_card 候補を作る
  function createBuyDevCardAction(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    if (!ctx.gameState.developmentDeck || !ctx.gameState.developmentDeck.length) return [];

    return [createAction("buy_dev_card", null)];
  }

  // 役割: 常に存在する do_nothing 候補を作る
  function createDoNothingAction() {
    return [createAction("do_nothing", null)];
  }

  // 役割: 現在盗賊がいる hexId を返す
  function getCurrentRobberHexId(ctx) {
    const robberHexState = (ctx.gameState.boardState.hexStates || []).find((hexState) => hexState && hexState.robber);
    return robberHexState ? robberHexState.id : null;
  }

  // 役割: 現在位置以外の全 hex を盗賊移動候補として作る
  function createRobberMoveCandidates(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    const currentRobberHexId = getCurrentRobberHexId(ctx);
    return ctx.boardData.hexes
      .filter((hex) => hex.id !== currentRobberHexId)
      .map((hex) => createAction("move_robber", `h${hex.id}`, {
        canExecuteNow: true,
        missingResources: []
      }));
  }

  // 役割: 現在使える発展カード use_xxx action を 1 種 1 件で作る
  // 使用: 通常手番の候補選出フェーズで、カード所持状況から use 系候補を起こす時
  // 入出力: playerId を受け取り、use_xxx action 配列を返す
  // 関連: getPlayerById / buildActionCandidates / evaluateYearOfPlentyActions / evaluateRoadBuildingActions
  function createDevCardUseActions(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    const player = getPlayerById(playerId, ctx);
    if (!player || player.usedDevCardThisTurn) return [];

    const playableTypes = new Set(
      (player.developmentCards || [])
        .filter((card) => card && card.drawnTurn !== ctx.gameState.currentTurn)
        .map((card) => card.type)
    );

    const actionSpecs = [
      { type: "knight", actionType: "use_knight", needsManualResolution: true },
      { type: "road_building", actionType: "use_road_building", needsManualResolution: true },
      { type: "year_of_plenty", actionType: "use_year_of_plenty", needsManualResolution: true },
      { type: "monopoly", actionType: "use_monopoly", needsManualResolution: true },
      { type: "victory_point", actionType: "use_victory_point", needsManualResolution: false }
    ];

    return actionSpecs
      .filter((spec) => playableTypes.has(spec.type))
      .map((spec) => createAction(
        spec.actionType,
        null,
        spec.needsManualResolution ? { needsManualResolution: true } : {}
      ));
  }

  // 役割: 街道建設カード用に 1 本目だけ仮置きした edgeStates コンテキストを作る
  // 使用: use_road_building の 2 本目候補再計算時
  // 入出力: baseCtx, playerId, placedEdgeId を受け取り、仮 edgeStates を持つ ctx を返す
  // 関連: buildRoadBuildingSecondRoadCandidates / getLegalRoadCandidatesFromContext / scoreBuildRoadActionWithContext
  function createVirtualRoadBuildingContext(baseCtx, playerId, placedEdgeId) {
    const edgeStates = baseCtx.edgeStates.map((edgeState, index) => (
      index === placedEdgeId
        ? { ...edgeState, ownerPlayerId: playerId }
        : { ...edgeState }
    ));

    return {
      ...baseCtx,
      edgeStates
    };
  }

  // 役割: 仮盤面 ctx を使って build_road action を採点する
  function scoreBuildRoadActionWithContext(action, playerId, ctx) {
    const scoringApi = window.CatanScoring;
    if (!scoringApi || typeof scoringApi.scoreBuildRoadWithContext !== "function") {
      return {
        ...action,
        score: 0,
        scoreBreakdown: { base: 0 }
      };
    }

    const scored = scoringApi.scoreBuildRoadWithContext(action, playerId, ctx) || {};
    return {
      ...action,
      score: typeof scored.score === "number" ? scored.score : 0,
      scoreBreakdown: scored.scoreBreakdown || { base: 0 }
    };
  }

  // 役割: 1 本目仮置き後の 2 本目道路候補を再列挙・再採点する
  // 使用: use_road_building の組み合わせ探索時
  // 入出力: playerId, firstRoadAction, baseCtx を受け取り、score 済み 2 本目候補配列を返す
  // 関連: createVirtualRoadBuildingContext / getLegalRoadCandidatesFromContext / scoreBuildRoadActionWithContext
  function buildRoadBuildingSecondRoadCandidates(playerId, firstRoadAction, baseCtx) {
    const firstEdgeId = getEdgeIdFromActionTarget(firstRoadAction?.targetId);
    if (firstEdgeId === null || !baseCtx) {
      return [];
    }

    const virtualCtx = createVirtualRoadBuildingContext(baseCtx, playerId, firstEdgeId);
    return getLegalRoadCandidatesFromContext(playerId, virtualCtx).map((edgeId) => (
      scoreBuildRoadActionWithContext(
        createAction("build_road", `e${edgeId}`, {
          canExecuteNow: true,
          missingResources: []
        }),
        playerId,
        virtualCtx
      )
    ));
  }

  // 役割: 1 本目と 2 本目の最良組み合わせを探索して街道建設カード用プランを返す
  // 使用: use_road_building 候補の動的評価時
  // 入出力: playerId, 既存 build_road 候補配列を受け取り、最良 plan オブジェクトまたは null を返す
  // 関連: buildRoadBuildingSecondRoadCandidates / createRoadBuildingAction / SCORING_CONFIG.roadBuilding
  function getBestRoadBuildingPlan(playerId, firstRoadCandidates) {
    const baseCtx = getCpuBoardContext();
    if (!baseCtx || !Array.isArray(firstRoadCandidates) || !firstRoadCandidates.length) {
      return null;
    }

    const firstRoadWeight = window.CatanScoring?.SCORING_CONFIG?.roadBuilding?.firstRoadWeight || 0.4;
    let bestPlan = null;

    firstRoadCandidates.forEach((firstRoadAction) => {
      const firstEdgeId = getEdgeIdFromActionTarget(firstRoadAction.targetId);
      if (firstEdgeId === null) {
        return;
      }

      const secondRoadCandidates = buildRoadBuildingSecondRoadCandidates(playerId, firstRoadAction, baseCtx);
      const bestSecondRoadAction = secondRoadCandidates.reduce((bestAction, action) => (
        !bestAction || action.score > bestAction.score ? action : bestAction
      ), null);

      const firstRoadScore = typeof firstRoadAction.score === "number" ? firstRoadAction.score : 0;
      const secondRoadScore = typeof bestSecondRoadAction?.score === "number" ? bestSecondRoadAction.score : 0;
      const finalScore = secondRoadScore + (firstRoadScore * firstRoadWeight);
      const plan = {
        targetEdges: bestSecondRoadAction
          ? [firstEdgeId, getEdgeIdFromActionTarget(bestSecondRoadAction.targetId)]
          : [firstEdgeId],
        firstRoadScore,
        secondRoadScore,
        firstRoadWeight,
        finalScore,
        firstRoadAction,
        secondRoadAction: bestSecondRoadAction,
        secondRoadCandidates
      };

      if (!bestPlan || plan.finalScore > bestPlan.finalScore) {
        bestPlan = plan;
      }
    });

    return bestPlan;
  }

  // 役割: 街道建設カード候補に targetEdges と各 score 情報を埋め込む
  function createRoadBuildingAction(baseAction, plan) {
    return {
      ...baseAction,
      targetEdges: plan?.targetEdges || [],
      firstRoadScore: plan?.firstRoadScore || 0,
      secondRoadScore: plan?.secondRoadScore || 0,
      canExecuteNow: true,
      missingResources: []
    };
  }

  // 役割: use_road_building 候補を通常道路候補の結果から動的再評価する
  // 使用: actionCandidates の初回採点後、Year of Plenty や銀行交換より前に実行する
  // 入出力: actions 配列と playerId を受け取り、use_road_building を再採点した actions を返す
  // 関連: getBestRoadBuildingPlan / createRoadBuildingAction / scoreActionWithScoringApi / buildActionCandidates
  function evaluateRoadBuildingActions(actions, playerId) {
    const firstRoadCandidates = actions.filter((action) => (
      action
      && action.actionType === "build_road"
      && typeof action.score === "number"
    ));

    const bestPlan = getBestRoadBuildingPlan(playerId, firstRoadCandidates);

    return actions.map((action) => {
      if (action.actionType !== "use_road_building") {
        return action;
      }

      return scoreActionWithScoringApi(createRoadBuildingAction(action, bestPlan), playerId);
    });
  }

  // 役割: missingResources から収穫カードで取得する 2 資源を決める
  function buildYearOfPlentyGetResources(missingResources) {
    if (!Array.isArray(missingResources) || missingResources.length === 0) {
      return [];
    }

    if (missingResources.length === 1) {
      return [{ resource: missingResources[0], amount: 2 }];
    }

    return aggregateResourceList(missingResources.slice(0, 2));
  }

  // 役割: 収穫カード後の仮資源で目標 action が成立するかを返す
  function canExecuteTargetActionAfterYearOfPlenty(targetAction, resourcesAfterGain) {
    return evaluateActionExecutability(targetAction, resourcesAfterGain).canExecuteNow;
  }

  // 役割: 収穫カードで救済対象にできる未実行 action かを判定する
  function isEligibleYearOfPlentyTarget(action) {
    return !!action
      && action.actionType !== "use_year_of_plenty"
      && action.actionType !== "bank_trade"
      && action.canExecuteNow === false
      && typeof action.score === "number"
      && Array.isArray(action.missingResources)
      && action.missingResources.length >= 1
      && action.missingResources.length <= 2;
  }

  // 役割: use_year_of_plenty 候補に取得資源と目標 action 情報を埋め込む
  function createYearOfPlentyAction(baseAction, targetAction, getItems) {
    return {
      ...baseAction,
      get: getItems,
      targetActionType: targetAction?.actionType || null,
      targetTargetId: targetAction?.targetId || null,
      targetActionScore: typeof targetAction?.score === "number" ? targetAction.score : 0,
      canExecuteNow: true,
      missingResources: []
    };
  }

  // 役割: window.CatanScoring.scoreAction を通して action に score を付与する
  function scoreActionWithScoringApi(action, playerId) {
    const scoringApi = window.CatanScoring;
    if (!scoringApi || typeof scoringApi.scoreAction !== "function") {
      return {
        ...action,
        score: 0,
        scoreBreakdown: { base: 0 }
      };
    }

    const scored = scoringApi.scoreAction(action, playerId) || {};
    return {
      ...action,
      ...scored,
      score: typeof scored.score === "number" ? scored.score : 0,
      scoreBreakdown: scored.scoreBreakdown || { base: 0 }
    };
  }

  // 役割: use_year_of_plenty 候補を通常候補の不足資源とスコアから動的再評価する
  // 使用: 通常候補スコア計算の後、銀行交換候補生成の前に実行する
  // 入出力: actions 配列と playerId を受け取り、use_year_of_plenty を再採点した actions を返す
  // 関連: isEligibleYearOfPlentyTarget / createYearOfPlentyAction / scoreActionWithScoringApi / buildActionCandidates
  function evaluateYearOfPlentyActions(actions, playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) {
      return actions;
    }

    const player = getPlayerById(playerId, ctx);
    if (!player) {
      return actions;
    }

    const targetCandidates = actions
      .filter(isEligibleYearOfPlentyTarget)
      .sort((a, b) => b.score - a.score);

    return actions.map((action) => {
      if (action.actionType !== "use_year_of_plenty") {
        return action;
      }

      const chosenTargetAction = targetCandidates.find((targetAction) => {
        const getItems = buildYearOfPlentyGetResources(targetAction.missingResources);
        const resourcesAfterGain = applyResourceGainToResources(player.resources, getItems);
        return canExecuteTargetActionAfterYearOfPlenty(targetAction, resourcesAfterGain);
      }) || null;

      const getItems = chosenTargetAction
        ? buildYearOfPlentyGetResources(chosenTargetAction.missingResources)
        : [];

      return scoreActionWithScoringApi(
        createYearOfPlentyAction(action, chosenTargetAction, getItems),
        playerId
      );
    });
  }

  // 役割: プレイヤーが持つ港種別集合を vertex.portType から抽出する
  function getPlayerPortTypes(playerId, ctx) {
    const portTypes = new Set();

    ctx.boardData.vertices.forEach((vertex) => {
      if (!vertex || vertex.portType === null) {
        return;
      }

      const vertexState = ctx.vertexStates[vertex.id];
      if (!vertexState || vertexState.ownerPlayerId !== playerId || vertexState.buildingType === null) {
        return;
      }

      portTypes.add(vertex.portType);
    });

    return portTypes;
  }

  // 役割: プレイヤーごとの資源別銀行交換レートを返す
  // 使用: bank_trade 候補生成時に give 資源の最良レートを決める時
  // 入出力: playerId を受け取り、{ wood, brick, sheep, wheat, ore } のレート表を返す
  // 関連: getPlayerPortTypes / buildBankTradeActions / vertex.portType
  function getPlayerTradeRates(playerId) {
    const ctx = getCpuBoardContext();
    const resourceKeys = Object.keys(cloneResources());
    if (!ctx) {
      return resourceKeys.reduce((rates, resourceKey) => {
        rates[resourceKey] = 4;
        return rates;
      }, {});
    }

    const portTypes = getPlayerPortTypes(playerId, ctx);
    const hasGenericPort = portTypes.has("generic");

    return resourceKeys.reduce((rates, resourceKey) => {
      let rate = 4;
      if (hasGenericPort) {
        rate = 3;
      }
      if (portTypes.has(resourceKey)) {
        rate = 2;
      }
      rates[resourceKey] = rate;
      return rates;
    }, {});
  }

  // 役割: 単発の銀行交換を仮適用した後の資源状態を返す
  function applySingleTradeToResources(resources, giveResource, tradeRate, getResource) {
    const nextResources = cloneResources(resources);
    nextResources[giveResource] = (nextResources[giveResource] || 0) - tradeRate;
    nextResources[getResource] = (nextResources[getResource] || 0) + 1;
    return nextResources;
  }

  // 役割: 銀行交換後の仮資源で目標 action が成立するかを返す
  function canExecuteTargetActionAfterTrade(targetAction, resourcesAfterTrade) {
    return evaluateActionExecutability(targetAction, resourcesAfterTrade).canExecuteNow;
  }

  // 役割: bank_trade 候補 action を組み立てる
  function createBankTradeAction({ giveResource, getResource, tradeRate, targetAction }) {
    return createAction("bank_trade", null, {
      give: [{ resource: giveResource, amount: tradeRate }],
      get: [{ resource: getResource, amount: 1 }],
      tradeRate,
      targetActionType: targetAction.actionType,
      targetTargetId: targetAction.targetId,
      targetActionScore: targetAction.score,
      canExecuteNow: true,
      missingResources: []
    });
  }

  // 役割: 1 回交換で成立する bank_trade 候補だけを生成する
  // 使用: 通常候補のスコア計算と Year of Plenty 再評価のあと、bank_trade を actionCandidates に追加する時
  // 入出力: playerId, scoredActions を受け取り、score 未付与の bank_trade action 配列を返す
  // 関連: getPlayerTradeRates / applySingleTradeToResources / canExecuteTargetActionAfterTrade / createBankTradeAction
  function buildBankTradeActions(playerId, scoredActions) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    const player = getPlayerById(playerId, ctx);
    if (!player) return [];

    const tradeRates = getPlayerTradeRates(playerId);
    const resourcePool = cloneResources(player.resources);
    const tradeableResources = Object.keys(resourcePool).filter((resourceKey) => (
      (resourcePool[resourceKey] || 0) >= (tradeRates[resourceKey] || 4)
    ));

    if (!tradeableResources.length) {
      return [];
    }

    const pendingTargetActions = scoredActions.filter((action) => (
      action
      && action.actionType !== "bank_trade"
      && action.canExecuteNow === false
      && typeof action.score === "number"
      && Array.isArray(action.missingResources)
      && action.missingResources.length > 0
    ));

    if (!pendingTargetActions.length) {
      return [];
    }

    const bestTradeByKey = new Map();

    pendingTargetActions.forEach((targetAction) => {
      const neededResources = [...new Set(targetAction.missingResources)];

      neededResources.forEach((getResource) => {
        tradeableResources.forEach((giveResource) => {
          if (giveResource === getResource) {
            return;
          }

          const tradeRate = tradeRates[giveResource] || 4;
          const resourcesAfterTrade = applySingleTradeToResources(resourcePool, giveResource, tradeRate, getResource);
          if ((resourcesAfterTrade[giveResource] || 0) < 0) {
            return;
          }

          if (!canExecuteTargetActionAfterTrade(targetAction, resourcesAfterTrade)) {
            return;
          }

          const tradeKey = `${giveResource}:${tradeRate}->${getResource}`;
          const nextTradeAction = createBankTradeAction({
            giveResource,
            getResource,
            tradeRate,
            targetAction
          });
          const currentBestTrade = bestTradeByKey.get(tradeKey);

          if (!currentBestTrade || nextTradeAction.targetActionScore > currentBestTrade.targetActionScore) {
            bestTradeByKey.set(tradeKey, nextTradeAction);
          }
        });
      });
    });

    return Array.from(bestTradeByKey.values());
  }

  // 役割: 通常 action 配列へ score / scoreBreakdown を一括付与する
  // 使用: 候補選出と素材判定のあと、各 actionType の採点をまとめて流す時
  // 入出力: actions 配列と playerId を受け取り、採点済み actions を返す
  // 関連: window.CatanScoring.scoreAction / buildActionCandidates / scoreActionWithScoringApi
  function applyScoresToActions(actions, playerId) {
    const scoringApi = window.CatanScoring;
    if (!scoringApi || typeof scoringApi.scoreAction !== "function") {
      return actions.map((action) => ({
        ...action,
        score: 0,
        scoreBreakdown: { base: 0 }
      }));
    }

    return actions.map((action) => {
      const scored = scoringApi.scoreAction(action, playerId) || {};
      return {
        ...action,
        ...scored,
        score: typeof scored.score === "number" ? scored.score : 0,
        scoreBreakdown: scored.scoreBreakdown || { base: 0 }
      };
    });
  }

  // 役割: 盗賊移動候補へ robber 用スコアを一括付与する
  function applyScoresToRobberCandidates(candidates, playerId) {
    const scoringApi = window.CatanScoring;
    if (!scoringApi) {
      return candidates.map((candidate) => ({
        ...candidate,
        score: 0,
        scoreBreakdown: { baseScore: 0, diceMultiplier: 0, finalScore: 0 }
      }));
    }

    const scoreRobber = typeof scoringApi.scoreRobberMove === "function"
      ? scoringApi.scoreRobberMove.bind(scoringApi)
      : (typeof scoringApi.scoreAction === "function" ? scoringApi.scoreAction.bind(scoringApi) : null);

    if (!scoreRobber) {
      return candidates.map((candidate) => ({
        ...candidate,
        score: 0,
        scoreBreakdown: { baseScore: 0, diceMultiplier: 0, finalScore: 0 }
      }));
    }

    return candidates.map((candidate) => {
      const scored = scoreRobber(candidate, playerId) || {};
      return {
        ...candidate,
        score: typeof scored.score === "number" ? scored.score : 0,
        scoreBreakdown: scored.scoreBreakdown || { baseScore: 0, diceMultiplier: 0, finalScore: 0 }
      };
    });
  }

  // 役割: 通常手番の actionCandidates を legality → resources → scoring 順で構築する
  // 使用: 手番切替時、再描画時、CPU 最善手表示前などの候補更新入口
  // 入出力: playerId を受け取り、通常 action と bank_trade を含む採点済み action 配列を返す
  // 関連: annotateExecutableActions / applyScoresToActions / evaluateRoadBuildingActions / evaluateYearOfPlentyActions / buildBankTradeActions
  function buildActionCandidates(playerId) {
    const legalActions = [
      ...createBuildRoadActions(playerId),
      ...createBuildSettlementActions(playerId),
      ...createBuildCityActions(playerId),
      ...createBuyDevCardAction(playerId),
      ...createDevCardUseActions(playerId),
      ...createDoNothingAction()
    ];

    const executableActions = annotateExecutableActions(legalActions, playerId);
    const initiallyScoredActions = applyScoresToActions(executableActions, playerId);
    const roadBuildingScoredActions = evaluateRoadBuildingActions(initiallyScoredActions, playerId);
    const scoredActions = evaluateYearOfPlentyActions(roadBuildingScoredActions, playerId);
    const bankTradeActions = buildBankTradeActions(playerId, scoredActions);
    const scoredBankTradeActions = applyScoresToActions(bankTradeActions, playerId);
    return [...scoredActions, ...scoredBankTradeActions];
  }

  // 役割: 盗賊移動専用候補を生成して採点する
  // 使用: robberMode 中の CPU 最善手表示時
  // 入出力: playerId を受け取り、採点済み move_robber 候補配列を返す
  // 関連: createRobberMoveCandidates / applyScoresToRobberCandidates / getBestRobberMoveCandidate
  function buildRobberMoveCandidates(playerId) {
    const candidates = createRobberMoveCandidates(playerId);
    return applyScoresToRobberCandidates(candidates, playerId);
  }

  // 役割: 通常手番の actionCandidates から最善手 1 件を返す
  // 使用: CPU用最善手表示ボタン押下時
  // 入出力: playerId を受け取り、実行可能候補の最高 score action、無ければ do_nothing か null を返す
  // 関連: buildActionCandidates / rebuildActionCandidates / index_v2.html の showCpuBestActionForCurrentPlayer
  function getBestActionForPlayer(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return null;

    const player = getPlayerById(playerId, ctx);
    if (!player) return null;

    const actions = Array.isArray(player.actionCandidates) && player.actionCandidates.length
      ? player.actionCandidates
      : buildActionCandidates(playerId);

    if (!Array.isArray(player.actionCandidates) || !player.actionCandidates.length) {
      player.actionCandidates = actions;
    }

    const executableActions = actions.filter((action) => (
      action
      && action.canExecuteNow === true
      && typeof action.score === "number"
    ));

    if (executableActions.length) {
      return executableActions.reduce((bestAction, action) => (
        !bestAction || action.score > bestAction.score ? action : bestAction
      ), null);
    }

    return actions.find((action) => action && action.actionType === "do_nothing") || null;
  }

  // 役割: 盗賊移動候補から最善の移動先 1 件を返す
  function getBestRobberMoveCandidate(playerId, robberCandidates = null) {
    const candidates = Array.isArray(robberCandidates) ? robberCandidates : buildRobberMoveCandidates(playerId);
    if (!candidates.length) {
      return null;
    }

    const scorableCandidates = candidates.filter((candidate) => (
      candidate
      && candidate.canExecuteNow === true
      && typeof candidate.score === "number"
    ));

    if (!scorableCandidates.length) {
      return null;
    }

    return scorableCandidates.reduce((bestCandidate, candidate) => (
      !bestCandidate || candidate.score > bestCandidate.score ? candidate : bestCandidate
    ), null);
  }

  // 役割: プレイヤーの actionCandidates を再生成して state と console に反映する
  // 使用: 手番切替時や renderAll 前の同期入口
  // 入出力: playerId を受け取り、最新の actionCandidates 配列を返す
  // 関連: buildActionCandidates / getBestActionForPlayer / syncActivePlayerActionCandidates
  function rebuildActionCandidates(playerId) {
    const ctx = getCpuBoardContext();
    if (!ctx) return [];

    const player = getPlayerById(playerId, ctx);
    if (!player) return [];

    const actions = buildActionCandidates(playerId);
    player.actionCandidates = actions;
    console.log(`[CatanCPU] action candidates after legality -> resources -> scoring for player ${playerId}`, actions);
    return actions;
  }

  const api = {
    ACTION_RESOURCE_REQUIREMENTS,
    getCpuBoardContext,
    isEmptyVertex,
    isEmptyEdge,
    isPlayerBuilding,
    isOpponentBuilding,
    isPlayerRoad,
    getAdjacentVertexIds,
    getAdjacentEdgeIds,
    hasNoAdjacentBuildings,
    hasAdjacentPlayerRoad,
    isConnectedToPlayerRoad,
    isRoadConnectableFromVertex,
    getLegalRoadCandidates,
    getLegalSettlementCandidates,
    getLegalCityCandidates,
    getLegalMoveCandidates,
    getPlayerTradeRates,
    getActionResourceRequirements,
    getMissingResourcesForAction,
    evaluateActionExecutability,
    annotateExecutableActions,
    buildBankTradeActions,
    rebuildActionCandidates,
    buildActionCandidates,
    getInitialPlacementVertexCandidateIds,
    buildInitialPlacementVertexCandidates,
    getBestInitialPlacementVertex,
    getInitialPlacementEdgeCandidateIds,
    buildInitialPlacementEdgeCandidates,
    getBestInitialPlacementEdge,
    createRobberMoveCandidates,
    applyScoresToRobberCandidates,
    buildRobberMoveCandidates,
    getBestActionForPlayer,
    getBestRobberMoveCandidate,
    createBuildRoadActions,
    createBuildSettlementActions,
    createBuildCityActions,
    createBuyDevCardAction,
    createDoNothingAction,
    createDevCardUseActions,
    applyScoresToActions
  };

  window.getLegalRoadCandidates = getLegalRoadCandidates;
  window.getLegalSettlementCandidates = getLegalSettlementCandidates;
  window.getLegalCityCandidates = getLegalCityCandidates;
  window.getLegalMoveCandidates = getLegalMoveCandidates;
  window.rebuildActionCandidates = rebuildActionCandidates;

  if (typeof window.registerCpuHelper === "function") {
    window.registerCpuHelper(api);
  } else {
    window.CatanCPUHelper = api;
  }
})();
</script>
