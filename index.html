  // 役割: 六角形 1 枚分の頂点座標配列を返す
  function getHexPoints(cx, cy, size) {
    const points = [];
    for (let i = 0; i < 6; i++) {
      const angleDeg = 60 * i - 30;
      const angleRad = Math.PI / 180 * angleDeg;
      points.push({
        x: cx + size * Math.cos(angleRad),
        y: cy + size * Math.sin(angleRad)
      });
    }
    return points;
  }

  // 役割: 固定盤面の hex マスター座標一覧を作る
  function createHexMasters() {
    const size = 70;
    const dx = Math.sqrt(3) * size;
    const dy = 1.5 * size;
    const centerX = 550;
    const centerY = 390;
    const hexes = [];

    rowNames.forEach((row, rowIndex) => {
      const count = row.length;
      row.forEach((name, colIndex) => {
        const x = centerX + (colIndex - (count - 1) / 2) * dx;
        const y = centerY + (rowIndex - 2) * dy;
        hexes.push({
          id: hexIdMap[name],
          name,
          cx: x,
          cy: y,
          size
        });
      });
    });

    hexes.sort((a, b) => a.id - b.id);
    return hexes;
  }

  // 役割: hex / vertex / edge を持つ固定盤面データを構築する
  // 使用: init の最初で boardData を 1 回だけ作る時
  // 入出力: 引数なしで、hexes / vertices / edges を含む boardData を返す
  // 関連: createHexMasters / assignPortTypesToVertices / renderBoard / window.catanCpuBridge
  function buildBoardData() {
    const hexes = createHexMasters();
    const vertices = [];
    const edges = [];
    const vertexMap = new Map();
    const edgeMap = new Map();

    hexes.forEach((hex) => {
      const corners = getHexPoints(hex.cx, hex.cy, hex.size);
      hex.points = corners;
      hex.vertexIds = [];
      hex.edgeIds = [];
    //   hex.terrain = sampleTerrains[index] || "wood";

      corners.forEach((p) => {
        const key = pointKey(p.x, p.y);
        let vertexId;

        if (vertexMap.has(key)) {
          vertexId = vertexMap.get(key);
        } else {
          vertexId = vertices.length;
          vertices.push({ id: vertexId, x: p.x, y: p.y, portType: null });
          vertexMap.set(key, vertexId);
        }
        hex.vertexIds.push(vertexId);
      });

      for (let i = 0; i < 6; i++) {
        const v1 = hex.vertexIds[i];
        const v2 = hex.vertexIds[(i + 1) % 6];
        const key = edgeKey(v1, v2);

        let edgeId;
        if (edgeMap.has(key)) {
          edgeId = edgeMap.get(key);
        } else {
          const p1 = vertices[v1];
          const p2 = vertices[v2];
          edgeId = edges.length;
          edges.push({
            id: edgeId,
            v1,
            v2,
            x1: p1.x,
            y1: p1.y,
            x2: p2.x,
            y2: p2.y
          });
          edgeMap.set(key, edgeId);
        }

        hex.edgeIds.push(edgeId);
      }
    });

    assignPortTypesToVertices(vertices);

    return { hexes, vertices, edges };
  }

  // 役割: 資源キーが既存の資源種別かどうかを判定する
  function isValidResourceKey(resourceKey) {
    return RESOURCE_KEYS.includes(resourceKey);
  }

  // 役割: 資源増減配列を事前検証し、全件 OK の時だけ一括反映する
  // 使用: 将来の CPU 自動実行で、建設コスト・銀行交換・カード効果などをまとめて適用する時
  // 入出力: [{ playerId, resource, amount }] を受け取り、成功/失敗結果オブジェクトを返す
  // 関連: RESOURCE_KEYS / getPlayerById / clearLastSuggestedCpuAction
  function applyResourceChanges(changes, options = {}) {
    if (!Array.isArray(changes)) {
      return {
        ok: false,
        reason: "invalid_changes",
        detail: { changes }
      };
    }

    const normalizedChanges = [];

    for (let index = 0; index < changes.length; index += 1) {
      const change = changes[index];
      if (!change || typeof change !== "object") {
        return {
          ok: false,
          reason: "invalid_changes",
          detail: { index, change }
        };
      }

      const playerId = Number(change.playerId);
      if (!Number.isInteger(playerId)) {
        return {
          ok: false,
          reason: "player_not_found",
          detail: { index, change }
        };
      }

      const player = getPlayerById(playerId);
      if (!player) {
        return {
          ok: false,
          reason: "player_not_found",
          detail: { index, playerId, change }
        };
      }

      const resource = change.resource;
      if (!isValidResourceKey(resource)) {
        return {
          ok: false,
          reason: "invalid_resource",
          detail: { index, playerId, resource, change }
        };
      }

      const amount = Number(change.amount);
      if (!Number.isFinite(amount)) {
        return {
          ok: false,
          reason: "invalid_amount",
          detail: { index, playerId, resource, amount: change.amount, change }
        };
      }

      normalizedChanges.push({ playerId, resource, amount });
    }

    const netAmountByPlayerResource = new Map();
    normalizedChanges.forEach(({ playerId, resource, amount }) => {
      const key = `${playerId}:${resource}`;
      netAmountByPlayerResource.set(key, (netAmountByPlayerResource.get(key) || 0) + amount);
    });

    for (const [key, netAmount] of netAmountByPlayerResource.entries()) {
      if (netAmount >= 0) {
        continue;
      }

      const [playerIdRaw, resource] = key.split(":");
      const playerId = Number(playerIdRaw);
      const player = getPlayerById(playerId);
      const currentAmount = Number(player?.resources?.[resource] ?? 0);
      const requiredAmount = Math.abs(netAmount);

      if (!player) {
        return {
          ok: false,
          reason: "player_not_found",
          detail: { playerId, resource, netAmount }
        };
      }

      if (currentAmount + netAmount < 0) {
        return {
          ok: false,
          reason: "resource_shortage",
          detail: {
            playerId,
            resource,
            currentAmount,
            requiredAmount,
            netAmount
          }
        };
      }
    }

    if (options.dryRun) {
      return {
        ok: true,
        applied: normalizedChanges,
        dryRun: true,
        options
      };
    }

    clearLastSuggestedCpuAction("resource changes applied");

    normalizedChanges.forEach(({ playerId, resource, amount }) => {
      const player = getPlayerById(playerId);
      if (!player) return;
      if (typeof player.resources[resource] !== "number") {
        player.resources[resource] = 0;
      }
      player.resources[resource] = Math.max(0, player.resources[resource] + amount);
    });

    return {
      ok: true,
      applied: normalizedChanges,
      options
    };
  }

    // 役割: 山札先頭から発展カードを 1 枚引いて手番プレイヤーへ渡す
    // 使用: 右カラムの「発展カードを引く」ボタン押下時
    // 入出力: 引数なしで、developmentDeck と developmentCards を更新し再描画する
    // 関連: renderFuturePanel / renderDevelopmentModal / createDevelopmentDeck
    function drawDevelopmentCard() {
        const player = getCurrentPlayer();
        if (!player) return;
        if (!gameState.developmentDeck.length) return;

        card.drawnTurn = gameState.currentTurn;

    // 使用: 発展カード確認モーダル内の「使用する」ボタン押下時
    // 入出力: playerId, cardId を受け取り、developmentCards / usedDevelopmentCards などを更新する
    // 関連: renderDevelopmentModal / beginRobberMove / player.usedDevCardThisTurn
    function useDevelopmentCard(playerId, cardId) {
        const player = getPlayerById(playerId);
        if (!player) return;

        const cardIndex = player.developmentCards.findIndex((card) => card.id === cardId);
        if (cardIndex < 0) return;

        const card = player.developmentCards[cardIndex];
        if (card.drawnTurn === gameState.currentTurn) {
            return;
        }

        player.developmentCards.splice(cardIndex, 1);
        player.usedDevelopmentCards.push(card);
        player.usedDevCardThisTurn = true;
        closeDevelopmentModal();

    function renderInspectStatusBar() {

    // 役割: 最後に触った盤面 ID 表示を更新する
    // 使用: edge / vertex / hex の hover と click / tap 時
    // 入出力: kind と id を受け取り、常時表示エリアの lastTouchedLabel を更新する
    // 関連: renderInspectStatusBar / clearHoveredBoardIdDisplay / renderBoard
    function setHoveredBoardIdDisplay(kind, id) {
        inspectModeState.lastTouchedLabel = `${kind} ${id}`;
        renderInspectStatusBar();
    }

    // 役割: hover 終了時にも最後に触ったID表示を維持したまま UI を再描画する
    function clearHoveredBoardIdDisplay() {
        renderInspectStatusBar();
    }

    // 役割: 盤面タップを即時処理したいタッチ系入力環境かどうかを返す
    function usesDirectBoardTapActivation() {
        return window.matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0;
    }

    // 役割: 盤面 hover による ID 確認を有効にするマウス環境かどうかを返す
    function supportsBoardHoverPreview() {
        return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    }

    // 役割: hex / edge / vertex の入力入口を共通化し、ID更新と本処理呼び出しを分岐する
    // 使用: renderBoard 内の盤面 hit 要素の click / tap 時
    // 入出力: type, id, event を受け取り、LastID を更新して必要なら既存の handleXxxClick を呼ぶ
    // 関連: addBoardActivateListener / setHoveredBoardIdDisplay / handleHexClick / handleEdgeClick / handleVertexClick
    function handleBoardTargetActivate(type, id, event) {
        if (event) {
            event.stopPropagation?.();
            if (event.type !== "click") {
                event.preventDefault?.();
            }
        }

        const label = type === "hex"
            ? "Hex"
            : type === "edge"
                ? "Edge"
                : "Vertex";
        setHoveredBoardIdDisplay(label, id);

        if (inspectModeState.active) {
            return;
        }

        if (type === "hex") {
            handleHexClick(id);
            return;
        }
        if (type === "edge") {
            handleEdgeClick(id);
            return;
        }
        handleVertexClick(id);
    }

    // 役割: 盤面 hit 要素に、入力環境に応じた hover / click / tap の入口を付与する
    // 使用: renderBoard で hex / edge / vertex の hit 要素を作った直後
    // 入出力: element, type, id を受け取り、PC は hover + click、タッチ系は pointerup/touchend を設定する
    // 関連: handleBoardTargetActivate / usesDirectBoardTapActivation / supportsBoardHoverPreview
    function addBoardActivateListener(element, type, id) {
        if (!element) return;

        const label = type === "hex"
            ? "Hex"
            : type === "edge"
                ? "Edge"
                : "Vertex";
        const activate = (event) => handleBoardTargetActivate(type, id, event);
        element.style.touchAction = "manipulation";

        if (supportsBoardHoverPreview()) {
            element.addEventListener("mouseenter", () => setHoveredBoardIdDisplay(label, id));
            element.addEventListener("mouseleave", clearHoveredBoardIdDisplay);
        }

        if (usesDirectBoardTapActivation()) {
            if (typeof window.PointerEvent === "function") {
                element.addEventListener("pointerup", activate);
            } else {
                element.addEventListener("touchend", activate, { passive: false });
            }
            return;
        }

        element.addEventListener("click", activate);
    }

    // 役割: 右カラム表示用に最善手の概要文字列を組み立てる
    function formatBestActionSummary(player, action) {
        if (!player || !action) {
            return "実行可能な候補なし";
        }

        const parts = [
            `${player.name}`,
            `最善手: ${getActionDisplayLabel(action.actionType)}`
        ];

        if (action.targetId) {
            parts.push(`対象: ${action.targetId}`);
        }

        if (action.actionType === "move_robber" && action.scoreBreakdown?.areaNumber) {
            parts.push(`数字: ${action.scoreBreakdown.areaNumber}`);
        }

        if (action.actionType === "bank_trade") {
            parts.push(`出す: ${formatTradeResources(action.give)}`);
            parts.push(`得る: ${formatTradeResources(action.get)}`);
        }

        if (action.actionType === "use_year_of_plenty") {
            parts.push(`取得: ${formatTradeResources(action.get)}`);
        }

        if (action.actionType === "use_road_building") {
            parts.push(`配置候補: ${(action.targetEdges || []).join(", ") || "-"}`);
        }

        parts.push(`score: ${typeof action.score === "number" ? action.score : "-"}`);
        parts.push(`実行可: ${action.canExecuteNow ? "はい" : "いいえ"}`);
        return parts.join(" / ");
    }

    // 役割: alert 表示用に最善手の詳細文字列を組み立てる
    function formatBestActionAlertText(action) {
        if (!action) {
            return "実行可能な候補なし";
        }

        const lines = [
            `アクション名: ${getActionDisplayLabel(action.actionType)}`,
            `targetID: ${action.targetId || "-"}`,
            `スコア: ${typeof action.score === "number" ? action.score : "-"}`
        ];

        if (action.actionType === "bank_trade") {
            lines.push(`give: ${formatTradeResources(action.give)}`);
            lines.push(`get: ${formatTradeResources(action.get)}`);
            lines.push(`交換レート: ${action.tradeRate || "-"}`);
            lines.push(
                `目標行動: ${getActionDisplayLabel(action.targetActionType)}${action.targetTargetId ? ` / ${action.targetTargetId}` : ""}`
            );
        }

        if (action.actionType === "use_year_of_plenty") {
            lines.push(`取得資源: ${formatTradeResources(action.get)}`);
            lines.push(
                `目標行動: ${getActionDisplayLabel(action.targetActionType)}${action.targetTargetId ? ` / ${action.targetTargetId}` : ""}`
            );
        }

        if (action.actionType === "use_road_building") {
            lines.push(`配置候補: ${(action.targetEdges || []).join(", ") || "-"}`);
            lines.push(`1本目score: ${typeof action.firstRoadScore === "number" ? action.firstRoadScore : "-"}`);
            lines.push(`2本目score: ${typeof action.secondRoadScore === "number" ? action.secondRoadScore : "-"}`);
        }

        return lines.join("\n");
    }

    // 役割: 現在手番の CPU 最善手を取得して右カラム・alert・console に出す
    // 使用: 「CPU用最善手表示」ボタン押下時
    // 入出力: 引数なしで、通常手番か robberMode かを判定して最善候補を表示する
    // 関連: syncActivePlayerActionCandidates / getBestActionForPlayer / getBestRobberMoveCandidateForPlayer / formatBestActionAlertText
    function showCpuBestActionForCurrentPlayer() {
        const activePlayer = getCurrentPlayer();
        if (!activePlayer) {
            clearCpuBestActionDisplay();
            clearLastSuggestedCpuAction("no active player");
            renderFuturePanel();
            window.alert("実行可能な候補なし");
            return;
        }

        if (gameState.robberMode?.active) {
            const robberPlayerId = gameState.robberMode?.playerId ?? activePlayer.id;
            const robberPlayer = getPlayerById(robberPlayerId) || activePlayer;
            const robberCandidates = buildRobberMoveCandidatesForPlayer(robberPlayer.id);
            const bestRobberCandidate = getBestRobberMoveCandidateForPlayer(robberPlayer.id, robberCandidates);

            cpuBestActionDisplayState.playerId = robberPlayer.id;
            cpuBestActionDisplayState.action = bestRobberCandidate;
            cpuBestActionDisplayState.statusText = bestRobberCandidate
                ? formatBestActionSummary(robberPlayer, bestRobberCandidate)
                : `${robberPlayer.name} / 盗賊移動 / 候補なし`;

            console.log(`[CatanCPU] robber candidates for player ${robberPlayer.id}`, robberCandidates);
            console.log(`[CatanCPU] best robber candidate for player ${robberPlayer.id}`, bestRobberCandidate);
            storeLastSuggestedCpuAction(robberPlayer.id, bestRobberCandidate);
            renderFuturePanel();
            window.alert(formatBestActionAlertText(bestRobberCandidate));
            return;
        }

        syncActivePlayerActionCandidates();
        const bestAction = getBestActionForPlayer(activePlayer.id);
        cpuBestActionDisplayState.playerId = activePlayer.id;
        cpuBestActionDisplayState.action = bestAction;
        cpuBestActionDisplayState.statusText = bestAction
            ? formatBestActionSummary(activePlayer, bestAction)
            : `${activePlayer.name} / 実行可能な候補なし`;

        console.log(`[CatanCPU] best action for player ${activePlayer.id}`, bestAction);
        storeLastSuggestedCpuAction(activePlayer.id, bestAction);
        renderFuturePanel();
        window.alert(formatBestActionAlertText(bestAction));
    }

    // 役割: action.targetId から edgeId を取り出す
    function getEdgeIdFromActionTarget(targetId) {
        if (typeof targetId !== "string" || !targetId.startsWith("e")) {
            return null;
        }

        const edgeId = Number(targetId.slice(1));
        return Number.isInteger(edgeId) ? edgeId : null;
    }

    // 役割: action.targetId から vertexId を取り出す
    function getVertexIdFromActionTarget(targetId) {
        if (typeof targetId !== "string" || !targetId.startsWith("v")) {
            return null;
        }

        const vertexId = Number(targetId.slice(1));
        return Number.isInteger(vertexId) ? vertexId : null;
    }

    // 役割: action.targetId から hexId を取り出す
    function getHexIdFromActionTarget(targetId) {
        if (typeof targetId === "number") {
            return Number.isInteger(targetId) ? targetId : null;
        }

        if (typeof targetId !== "string" || !targetId.startsWith("h")) {
            return null;
        }

        const hexId = Number(targetId.slice(1));
        return Number.isInteger(hexId) ? hexId : null;
    }

    // 役割: {resource, amount} 配列を applyResourceChanges 用の change 配列へ変換する
    function buildResourceChangesFromItems(playerId, items = [], direction = 1) {
        if (!Array.isArray(items)) {
            return [];
        }

        return items
            .filter((item) => item && item.resource && Number.isFinite(Number(item.amount)))
            .map((item) => ({
                playerId,
                resource: item.resource,
                amount: Number(item.amount) * direction
            }));
    }

    // 役割: 資源変更を dry-run 検証だけ行う
    function canApplyResourceChanges(changes, options = {}) {
        return applyResourceChanges(changes, { ...options, dryRun: true });
    }

    // 役割: 指定種別の発展カードを 1 枚だけ未使用から使用済みへ移す
    function markDevelopmentCardUsed(playerId, cardType) {
        const player = getPlayerById(playerId);
        if (!player) {
            return {
                ok: false,
                reason: "player_not_found",
                detail: { playerId, cardType }
            };
        }

        const cardIndex = player.developmentCards.findIndex((card) => (
            card
            && card.type === cardType
            && card.drawnTurn !== gameState.currentTurn
        ));

        if (cardIndex < 0) {
            return {
                ok: false,
                reason: "card_not_found",
                detail: { playerId, cardType }
            };
        }

        const [card] = player.developmentCards.splice(cardIndex, 1);
        player.usedDevelopmentCards.push(card);
        player.usedDevCardThisTurn = true;

        return {
            ok: true,
            card
        };
    }

    // 役割: CPU 用に道路建設を 1 本反映する
    function executeCpuBuildRoad(action, playerId) {
        const player = getPlayerById(playerId);
        const edgeId = getEdgeIdFromActionTarget(action?.targetId);
        const edgeState = edgeId !== null ? gameState.boardState.edgeStates[edgeId] : null;
        const costChanges = [
            { playerId, resource: "wood", amount: -1 },
            { playerId, resource: "brick", amount: -1 }
        ];

        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }
        if (edgeId === null || !edgeState) {
            return { ok: false, reason: "invalid_target", message: "道路の対象 edge が不正です" };
        }
        if (edgeState.ownerPlayerId !== null) {
            return { ok: false, reason: "edge_occupied", message: "その edge にはすでに道路があります" };
        }
        if (player.remainingPieces.roads <= 0) {
            return { ok: false, reason: "no_road_piece", message: "道路コマが残っていません" };
        }

        const precheck = canApplyResourceChanges(costChanges, { actionType: action.actionType });
        if (!precheck.ok) {
            return { ok: false, reason: precheck.reason, detail: precheck.detail, message: "資源が足りないため道路を建設できません" };
        }

        edgeState.ownerPlayerId = playerId;
        player.remainingPieces.roads -= 1;
        const applyResult = applyResourceChanges(costChanges, { actionType: action.actionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "資源反映に失敗したため道路建設を中止しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return { ok: true, actionType: action.actionType, message: `${player.name} が道路 ${action.targetId} を建設しました` };
    }

    // 役割: CPU 用に開拓地建設を 1 件反映する
    function executeCpuBuildSettlement(action, playerId) {
        const player = getPlayerById(playerId);
        const vertexId = getVertexIdFromActionTarget(action?.targetId);
        const vertexState = vertexId !== null ? gameState.boardState.vertexStates[vertexId] : null;
        const costChanges = [
            { playerId, resource: "wood", amount: -1 },
            { playerId, resource: "brick", amount: -1 },
            { playerId, resource: "sheep", amount: -1 },
            { playerId, resource: "wheat", amount: -1 }
        ];

        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }
        if (vertexId === null || !vertexState) {
            return { ok: false, reason: "invalid_target", message: "開拓地の対象 vertex が不正です" };
        }
        if (vertexState.ownerPlayerId !== null || vertexState.buildingType !== null) {
            return { ok: false, reason: "vertex_occupied", message: "その vertex にはすでに建物があります" };
        }
        if (player.remainingPieces.settlements <= 0) {
            return { ok: false, reason: "no_settlement_piece", message: "開拓地コマが残っていません" };
        }

        const precheck = canApplyResourceChanges(costChanges, { actionType: action.actionType });
        if (!precheck.ok) {
            return { ok: false, reason: precheck.reason, detail: precheck.detail, message: "資源が足りないため開拓地を建設できません" };
        }

        vertexState.ownerPlayerId = playerId;
        vertexState.buildingType = "settlement";
        player.remainingPieces.settlements -= 1;
        recomputePoints();
        const applyResult = applyResourceChanges(costChanges, { actionType: action.actionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "資源反映に失敗したため開拓地建設を中止しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return { ok: true, actionType: action.actionType, message: `${player.name} が開拓地 ${action.targetId} を建設しました` };
    }

    // 役割: CPU 用に都市化を 1 件反映する
    function executeCpuBuildCity(action, playerId) {
        const player = getPlayerById(playerId);
        const vertexId = getVertexIdFromActionTarget(action?.targetId);
        const vertexState = vertexId !== null ? gameState.boardState.vertexStates[vertexId] : null;
        const costChanges = [
            { playerId, resource: "wheat", amount: -2 },
            { playerId, resource: "ore", amount: -3 }
        ];

        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }
        if (vertexId === null || !vertexState) {
            return { ok: false, reason: "invalid_target", message: "都市化の対象 vertex が不正です" };
        }
        if (vertexState.ownerPlayerId !== playerId || vertexState.buildingType !== "settlement") {
            return { ok: false, reason: "invalid_city_target", message: "その vertex は都市化できません" };
        }
        if (player.remainingPieces.cities <= 0) {
            return { ok: false, reason: "no_city_piece", message: "都市コマが残っていません" };
        }

        const precheck = canApplyResourceChanges(costChanges, { actionType: action.actionType });
        if (!precheck.ok) {
            return { ok: false, reason: precheck.reason, detail: precheck.detail, message: "資源が足りないため都市化できません" };
        }

        vertexState.buildingType = "city";
        player.remainingPieces.cities -= 1;
        player.remainingPieces.settlements += 1;
        recomputePoints();
        const applyResult = applyResourceChanges(costChanges, { actionType: action.actionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "資源反映に失敗したため都市化を中止しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return { ok: true, actionType: action.actionType, message: `${player.name} が ${action.targetId} を都市化しました` };
    }

    // 役割: CPU 用に発展カードを 1 枚購入する
    function executeCpuBuyDevCard(action, playerId) {
        const player = getPlayerById(playerId);
        const costChanges = [
            { playerId, resource: "sheep", amount: -1 },
            { playerId, resource: "wheat", amount: -1 },
            { playerId, resource: "ore", amount: -1 }
        ];

        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }
        if (!gameState.developmentDeck.length) {
            return { ok: false, reason: "empty_deck", message: "発展カード山札が空です" };
        }

        const precheck = canApplyResourceChanges(costChanges, { actionType: action.actionType });
        if (!precheck.ok) {
            return { ok: false, reason: precheck.reason, detail: precheck.detail, message: "資源が足りないため発展カードを購入できません" };
        }

        const card = gameState.developmentDeck.shift();
        card.drawnTurn = gameState.currentTurn;
        player.developmentCards.push(card);
        const applyResult = applyResourceChanges(costChanges, { actionType: action.actionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "資源反映に失敗したため発展カード購入を中止しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        renderDevelopmentModal();
        return {
            ok: true,
            actionType: action.actionType,
            message: `${player.name} が発展カードを購入しました（${getDevelopmentCardDef(card.type).label}）`
        };
    }

    // 役割: CPU 用に銀行交換を 1 回だけ反映する
    function executeCpuBankTrade(action, playerId) {
        const changes = [
            ...buildResourceChangesFromItems(playerId, action?.give || [], -1),
            ...buildResourceChangesFromItems(playerId, action?.get || [], 1)
        ];

        const applyResult = applyResourceChanges(changes, { actionType: action.actionType, targetActionType: action.targetActionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "銀行交換を実行できませんでした" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return {
            ok: true,
            actionType: action.actionType,
            message: `銀行交換を実行しました（${formatTradeResources(action.give)} → ${formatTradeResources(action.get)}）`
        };
    }

    // 役割: CPU 用に収穫カードを使用して資源を獲得する
    function executeCpuYearOfPlenty(action, playerId) {
        const markResult = markDevelopmentCardUsed(playerId, "year_of_plenty");
        if (!markResult.ok) {
            return { ok: false, reason: markResult.reason, detail: markResult.detail, message: "使用できる収穫カードが見つかりません" };
        }

        const gainChanges = buildResourceChangesFromItems(playerId, action?.get || [], 1);
        const applyResult = applyResourceChanges(gainChanges, { actionType: action.actionType, targetActionType: action.targetActionType });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "収穫カードの資源付与に失敗しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return {
            ok: true,
            actionType: action.actionType,
            message: `収穫カードを使用しました（${formatTradeResources(action.get)}）`
        };
    }

    // 役割: CPU 用に街道建設カードで無料道路 2 本を反映する
    function executeCpuRoadBuilding(action, playerId) {
        const player = getPlayerById(playerId);
        const targetEdges = Array.isArray(action?.targetEdges) ? action.targetEdges : [];

        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }
        if (!targetEdges.length) {
            return { ok: false, reason: "invalid_target", message: "街道建設カードの対象 edge がありません" };
        }
        if (player.remainingPieces.roads < targetEdges.length) {
            return { ok: false, reason: "no_road_piece", message: "道路コマが足りません" };
        }

        for (const edgeId of targetEdges) {
            const edgeState = gameState.boardState.edgeStates[edgeId];
            if (!edgeState || edgeState.ownerPlayerId !== null) {
                return { ok: false, reason: "edge_occupied", message: "街道建設カードの対象 edge がすでに埋まっています", detail: { edgeId } };
            }
        }

        const markResult = markDevelopmentCardUsed(playerId, "road_building");
        if (!markResult.ok) {
            return { ok: false, reason: markResult.reason, detail: markResult.detail, message: "使用できる街道建設カードが見つかりません" };
        }

        targetEdges.forEach((edgeId) => {
            gameState.boardState.edgeStates[edgeId].ownerPlayerId = playerId;
            player.remainingPieces.roads -= 1;
        });

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return {
            ok: true,
            actionType: action.actionType,
            message: `街道建設カードを使用しました（${targetEdges.map((edgeId) => `e${edgeId}`).join(", ")}）`
        };
    }

    // 役割: CPU 用に独占カードを使用して対象資源を全員から回収する
    function executeCpuMonopoly(action, playerId) {
        const targetResource = action?.targetResource;
        if (!targetResource || !RESOURCE_KEYS.includes(targetResource)) {
            return { ok: false, reason: "invalid_resource", message: "独占カードの対象資源が不正です" };
        }

        const markResult = markDevelopmentCardUsed(playerId, "monopoly");
        if (!markResult.ok) {
            return { ok: false, reason: markResult.reason, detail: markResult.detail, message: "使用できる独占カードが見つかりません" };
        }

        const changes = [];
        let collectedAmount = 0;
        gameState.players.forEach((player) => {
            if (player.id === playerId) {
                return;
            }
            const owned = player.resources[targetResource] || 0;
            if (owned <= 0) {
                return;
            }
            changes.push({ playerId: player.id, resource: targetResource, amount: -owned });
            collectedAmount += owned;
        });
        if (collectedAmount > 0) {
            changes.push({ playerId, resource: targetResource, amount: collectedAmount });
        }

        const applyResult = applyResourceChanges(changes, { actionType: action.actionType, targetResource });
        if (!applyResult.ok) {
            return { ok: false, reason: applyResult.reason, detail: applyResult.detail, message: "独占カードの資源回収に失敗しました" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return {
            ok: true,
            actionType: action.actionType,
            message: `独占カードを使用しました（${RESOURCE_LABELS[targetResource]} を ${collectedAmount} 枚獲得）`
        };
    }

    // 役割: CPU 用に騎士カードを使用し、既存の盗賊奪取関数で 1 回奪う
    function executeCpuKnight(action, playerId) {
        const player = getPlayerById(playerId);
        if (!player) {
            return { ok: false, reason: "player_not_found", message: "プレイヤーが見つかりません" };
        }

        const markResult = markDevelopmentCardUsed(playerId, "knight");
        if (!markResult.ok) {
            return { ok: false, reason: markResult.reason, detail: markResult.detail, message: "使用できる騎士カードが見つかりません" };
        }
        player.usedKnightsCount += 1;

        const robberCandidates = buildRobberMoveCandidatesForPlayer(playerId);
        const bestRobberCandidate = getBestRobberMoveCandidateForPlayer(playerId, robberCandidates);
        const targetHexId = getHexIdFromActionTarget(bestRobberCandidate?.targetId);
        if (targetHexId === null) {
            return { ok: false, reason: "invalid_target", message: "盗賊移動先を決定できませんでした" };
        }

        gameState.boardState.hexStates.forEach((hexState) => {
            hexState.robber = false;
        });
        const targetHexState = getHexStateById(targetHexId);
        if (!targetHexState) {
            return { ok: false, reason: "invalid_target", message: "盗賊移動先 hex が不正です" };
        }
        targetHexState.robber = true;

        const candidatePlayerIds = getRobberVictimCandidates(targetHexId, playerId);
        if (!candidatePlayerIds.length) {
            saveGame(`cpu execute ${action.actionType}`);
            renderAll();
            return {
                ok: true,
                actionType: action.actionType,
                message: `騎士カードを使用しました（盗賊移動: h${targetHexId}、奪取対象なし）`
            };
        }

        const targetPlayerId = candidatePlayerIds.length === 1
            ? candidatePlayerIds[0]
            : chooseRobberVictimCandidate(candidatePlayerIds);

        executeRobberSteal(targetPlayerId, playerId);
        return {
            ok: true,
            actionType: action.actionType,
            message: `騎士カードを使用しました（盗賊移動: h${targetHexId}）`
        };
    }

    // 役割: CPU 用に勝利点カードを公開済みへ移す
    function executeCpuVictoryPoint(action, playerId) {
        const markResult = markDevelopmentCardUsed(playerId, "victory_point");
        if (!markResult.ok) {
            return { ok: false, reason: markResult.reason, detail: markResult.detail, message: "使用できる勝利点カードが見つかりません" };
        }

        saveGame(`cpu execute ${action.actionType}`);
        renderAll();
        return {
            ok: true,
            actionType: action.actionType,
            message: "勝利点カードを公開しました"
        };
    }

    // 役割: CPU 自動実行用に 1 action だけ実際の盤面・資源へ反映する
    // 使用: executeSuggestedCpuAction から、直前に保存した bestAction を再計算せずに実行する時
    // 入出力: action, playerId を受け取り、{ ok, reason?, message } を返す
    // 関連: applyResourceChanges / markDevelopmentCardUsed / executeRobberSteal / renderAll
    function executeCpuAction(action, playerId) {
        if (!action || !action.actionType) {
            return { ok: false, reason: "invalid_action", message: "実行できるactionがありません" };
        }

        switch (action.actionType) {
            case "build_road":
                return executeCpuBuildRoad(action, playerId);
            case "build_settlement":
                return executeCpuBuildSettlement(action, playerId);
            case "build_city":
                return executeCpuBuildCity(action, playerId);
            case "buy_dev_card":
                return executeCpuBuyDevCard(action, playerId);
            case "bank_trade":
                return executeCpuBankTrade(action, playerId);
            case "use_year_of_plenty":
                return executeCpuYearOfPlenty(action, playerId);
            case "use_road_building":
                return executeCpuRoadBuilding(action, playerId);
            case "use_monopoly":
                return executeCpuMonopoly(action, playerId);
            case "use_knight":
                return executeCpuKnight(action, playerId);
            case "use_victory_point":
                return executeCpuVictoryPoint(action, playerId);
            case "do_nothing":
                renderAll();
                return { ok: true, actionType: action.actionType, message: "CPUは何もしません" };
            default:
                return {
                    ok: false,
                    reason: "unsupported_action_type",
                    message: `actionType ${action.actionType} の自動実行はまだ未対応です`
                };
        }
    }

    // 役割: 直前に保存した CPU 最善手を検証し、1 手だけ実行する
    function executeSuggestedCpuAction() {
        if (!lastSuggestedCpuAction) {
            window.alert("先にCPU最善手表示を押してください");
            return;
        }

        const currentPlayer = getCurrentPlayer();
        const currentTurn = gameState.currentTurn || 1;
        if (!currentPlayer || currentPlayer.id !== lastSuggestedCpuAction.playerId || currentTurn !== lastSuggestedCpuAction.turn) {
            console.log("[CatanCPU] suggested action is stale", {
                saved: lastSuggestedCpuAction,
                currentPlayerId: currentPlayer?.id ?? null,
                currentTurn
            });
            clearCpuBestActionDisplay();
            clearLastSuggestedCpuAction("stale suggested action");
            renderFuturePanel();
            window.alert("状態が変わったため、再度CPU最善手表示を押してください");
            return;
        }

        if (!lastSuggestedCpuAction.action || !lastSuggestedCpuAction.actionType) {
            clearCpuBestActionDisplay();
            clearLastSuggestedCpuAction("invalid suggested action");
            renderFuturePanel();
            window.alert("実行できるactionがありません");
            return;
        }

        const savedAction = lastSuggestedCpuAction.action;
        const playerId = lastSuggestedCpuAction.playerId;
        clearCpuBestActionDisplay();
        console.log("[CatanCPU] execute suggested action requested", lastSuggestedCpuAction);

        const result = executeCpuAction(savedAction, playerId);
        console.log("[CatanCPU] executeCpuAction result", result);
        clearLastSuggestedCpuAction(result.ok ? `executed ${savedAction.actionType}` : `failed ${savedAction.actionType}`);

        if (!result.ok) {
            renderFuturePanel();
            window.alert(result.message || "CPU自動実行に失敗しました");
            return;
        }

        window.alert(result.message || `CPU自動実行を行いました: ${savedAction.actionType}`);
    }

    // 役割: 初期配置候補ハイライト用の一時 SVG レイヤーを取り除く
    function clearInitialPlacementHighlightLayer() {
        const svg = document.getElementById("board");
        if (!svg) return;
        svg.querySelector("#initial-placement-highlight-layer")?.remove();
    }

    // 役割: 初期配置検討で選ばれた vertex / edge を現在の盤面 SVG に一時ハイライトする
    function showInitialPlacementHighlight(vertexId, edgeId = null) {
        const svg = document.getElementById("board");
        if (!svg || !boardData) return;

        clearInitialPlacementHighlightLayer();

        const vertex = boardData.vertices.find((item) => item.id === vertexId);
        const edge = edgeId === null ? null : boardData.edges.find((item) => item.id === edgeId);
        if (!vertex && !edge) {
            return;
        }

        const highlightLayer = createSvgEl("g", {
            id: "initial-placement-highlight-layer",
            "pointer-events": "none"
        });

        if (edge) {
            const edgeHighlight = createSvgEl("line", {
                x1: edge.x1,
                y1: edge.y1,
                x2: edge.x2,
                y2: edge.y2,
                class: "initial-placement-edge-highlight"
            });
            highlightLayer.appendChild(edgeHighlight);
        }

        if (vertex) {
            const vertexHighlight = createSvgEl("circle", {
                cx: vertex.x,
                cy: vertex.y,
                r: 18,
                class: "initial-placement-vertex-highlight"
            });
            highlightLayer.appendChild(vertexHighlight);
        }

        svg.appendChild(highlightLayer);
    }

    // 役割: 今この盤面で初期配置するなら最善の vertex / edge を表示する
    // 使用: 「初期配置検討」ボタン押下時
    // 入出力: 引数なしで、最善頂点と edge を alert と console に出す
    // 関連: buildInitialPlacementVertexCandidatesForPlayer / getBestInitialPlacementVertexForPlayer / getBestInitialPlacementEdgeForPlayer
    function showInitialPlacementRecommendationForCurrentPlayer() {
        clearInitialPlacementHighlightLayer();
        const activePlayer = getCurrentPlayer();
        if (!activePlayer) {
            window.alert("初期配置候補を計算できませんでした");
            return;
        }

        const vertexCandidates = buildInitialPlacementVertexCandidatesForPlayer(activePlayer.id);
        const bestInitialVertex = getBestInitialPlacementVertexForPlayer(activePlayer.id, vertexCandidates);

        if (!bestInitialVertex) {
            console.log(`[CatanCPU] initial placement vertex candidates for player ${activePlayer.id}`, vertexCandidates);
            window.alert("初期配置可能な頂点候補がありません");
            return;
        }

        const bestVertexId = Number(bestInitialVertex.targetId?.slice(1));
        const edgeCandidates = buildInitialPlacementEdgeCandidatesForPlayer(activePlayer.id, bestVertexId);
        const bestInitialEdge = getBestInitialPlacementEdgeForPlayer(activePlayer.id, bestVertexId, edgeCandidates);

        console.log(`[CatanCPU] initial placement vertex candidates for player ${activePlayer.id}`, vertexCandidates);
        console.log(`[CatanCPU] best initial placement vertex for player ${activePlayer.id}`, bestInitialVertex);
        console.log(`[CatanCPU] initial placement edge candidates for player ${activePlayer.id}`, edgeCandidates);
        console.log(`[CatanCPU] best initial placement edge for player ${activePlayer.id}`, bestInitialEdge);

        showInitialPlacementHighlight(bestVertexId, bestInitialEdge ? getEdgeIdFromActionTarget(bestInitialEdge.targetId) : null);

        window.alert(
            [
                `初期配置候補`,
                `vertex: ${bestInitialVertex.targetId || "-"} / score: ${typeof bestInitialVertex.score === "number" ? bestInitialVertex.score : "-"}`,
                `edge: ${bestInitialEdge?.targetId || "-"} / score: ${typeof bestInitialEdge?.score === "number" ? bestInitialEdge.score : "-"}`
            ].join("\n")
        );
    }

    // 役割: 配列をシャッフルして新しい配列を返す
    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 役割: 地形ランダム化と盗賊初期配置を含む hexState 一覧を作る
    function createHexStates(boardData) {
        const terrainDeck = shuffle(TERRAIN_DECK_MASTER);

        const hexStates = boardData.hexes.map((hex, index) => {
            const terrain = terrainDeck[index];
            return {
            id: hex.id,
            terrain,
            number: null,
            robber: terrain === "desert"
            };
        });

        return assignNumbersToHexStates(hexStates);

// 役割: PORT_MARKERS をもとに港表示を盤面外周へ描画する
function renderPorts(portLayer) {
  PORT_MARKERS.forEach((port) => {
    const pointA = boardData.vertices[port.vertexIds[0]];
    const pointB = boardData.vertices[port.vertexIds[1]];
    if (!pointA || !pointB) return;

    const midX = (pointA.x + pointB.x) / 2;
    const midY = (pointA.y + pointB.y) / 2;
    const centerX = 550;
    const centerY = 390;
    const vectorX = midX - centerX;
    const vectorY = midY - centerY;
    const vectorLength = Math.hypot(vectorX, vectorY) || 1;
    const unitX = vectorX / vectorLength;
    const unitY = vectorY / vectorLength;
    const anchorX = midX + unitX * 16;
    const anchorY = midY + unitY * 16;
    const boxCenterX = midX + unitX * 84;
    const boxCenterY = midY + unitY * 84;

    const group = createSvgEl("g", {
      class: "port-group",
      "data-port-id": port.id
    });

    const line = createSvgEl("line", {
      x1: anchorX,
      y1: anchorY,
      x2: boxCenterX,
      y2: boxCenterY,
      class: "port-line"
    });
    group.appendChild(line);

    const shore = createSvgEl("line", {
      x1: pointA.x,
      y1: pointA.y,
      x2: pointB.x,
      y2: pointB.y,
      class: "port-shore"
    });
    group.appendChild(shore);

    [pointA, pointB].forEach((point) => {
      const node = createSvgEl("circle", {
        cx: point.x,
        cy: point.y,
        r: 8,
        class: "port-node"
      });
      group.appendChild(node);
    });

    const anchor = createSvgEl("circle", {
      cx: anchorX,
      cy: anchorY,
      r: 5,
      class: "port-anchor"
    });
    group.appendChild(anchor);

    const boxHeight = 48;
    const boxX = boxCenterX - port.width / 2;
    const boxY = boxCenterY - boxHeight / 2;

    const box = createSvgEl("rect", {
      x: boxX,
      y: boxY,
      width: port.width,
      height: boxHeight,
      rx: 12,
      ry: 12,
      class: "port-box"
    });
    group.appendChild(box);

    const detail = createSvgEl("text", {
      x: boxCenterX,
      y: boxY + 16,
      class: "port-detail"
    });
    detail.textContent = port.detail;
    group.appendChild(detail);

    const label = createSvgEl("text", {
      x: boxCenterX,
      y: boxY + 34,
      class: "port-label"
    });
    label.textContent = port.label;
    group.appendChild(label);

    portLayer.appendChild(group);
  });

  // 役割: 建物数と手動ボーナス状態から各プレイヤー勝利点を再計算する
  function recomputePoints() {
    gameState.players.forEach((player) => {
      let points = 0;

      gameState.boardState.vertexStates.forEach((v) => {
        if (v.ownerPlayerId !== player.id) return;
        if (v.buildingType === "settlement") points += 1;
        if (v.buildingType === "city") points += 2;
      });

      if (gameState.awards?.largestArmyPlayerId === player.id) points += 2;
      if (gameState.awards?.longestRoadPlayerId === player.id) points += 2;

      player.points = points;
    });
  }

  // 役割: 最大騎士 / 最長交易路の手動付与先を更新する
  function setAwardOwner(awardKey, playerId) {
    if (!gameState.awards) {
      gameState.awards = {
        largestArmyPlayerId: null,
        longestRoadPlayerId: null
      };
    }

  // 役割: 手番プレイヤーを切り替え、必要なターン進行状態を更新する

  // 入出力: playerId を受け取り、currentTurn / activePlayerId / usedDevCardThisTurn などを更新する
  // 関連: clearCpuBestActionDisplay / renderAll / renderDevelopmentModal
  function setActivePlayer(playerId) {
    const nextPlayerId = Number(playerId);
    if (gameState.activePlayerId !== nextPlayerId) {
      gameState.currentTurn = (gameState.currentTurn || 1) + 1;
      clearCpuBestActionDisplay();

  // 役割: 指定プレイヤー資源を手動で増減する
  function adjustResource(playerId, resourceKey, delta) {
    const player = getPlayerById(playerId);
    if (!player) return;
    const next = player.resources[resourceKey] + delta;
    player.resources[resourceKey] = Math.max(0, next);

    // 役割: 1 個のサイコロ出目を返す
    function rollDie() {

    }

    // 役割: 出目確定後の pending 状態と 7 処理入口を管理する
    function handleDiceRolled(total, die1, die2) {
        gameState.dice.distributionPending = true;
        if (total === 7) {
            gameState.dice.distributionPending = false;
            beginRobberMove("dice7", gameState.activePlayerId);
        }
    // 将来ここで資源配布や7処理を呼ぶ
    // 例:
    // distributeResources(total);
    // if (total === 7) { ... }
    }

    // 役割: hexId から hexState を取得する
    function getHexStateById(hexId) {
        return gameState.boardState.hexStates.find(h => h.id === hexId) || null;
    }

    // 役割: 指定プレイヤー資源を内部的に加算する
    function incrementPlayerResource(playerId, resourceKey, amount = 1) {
        const player = getPlayerById(playerId);
        if (!player) return;

        if (typeof player.resources[resourceKey] !== "number") {
            player.resources[resourceKey] = 0;
        }

        player.resources[resourceKey] += amount;
    }

    // 役割: 出目 total に応じた資源配布を自動実行しログを返す
    // 使用: サイコロ後の「資源配布」ボタン押下時
    // 入出力: total を受け取り、配布ログ配列を返す
    // 関連: incrementPlayerResource / summarizeDistributionLog / distributeResourcesForCurrentRoll
    function distributeResourcesByTotal(total) {
        const distributionLog = [];

        for (const hex of boardData.hexes) {
            const hexState = getHexStateById(hex.id);
            if (!hexState) continue;
            if (hexState.robber) continue;
            if (hexState.number !== total) continue;
            if (hexState.terrain === "desert") continue;

            for (const vertexId of hex.vertexIds) {
            const vertexState = gameState.boardState.vertexStates[vertexId];
            if (!vertexState) continue;
            if (vertexState.ownerPlayerId === null) continue;
            if (vertexState.buildingType === null) continue;

            let amount = 0;
            if (vertexState.buildingType === "settlement") amount = 1;
            if (vertexState.buildingType === "city") amount = 2;
            if (amount <= 0) continue;

            incrementPlayerResource(vertexState.ownerPlayerId, hexState.terrain, amount);

            distributionLog.push({
                playerId: vertexState.ownerPlayerId,
                terrain: hexState.terrain,
                amount,
                hexId: hex.id
            });
            }
        }

        return distributionLog;
    }

    // 役割: 資源配布ログを alert 表示用の要約文字列へ整形する
    function summarizeDistributionLog(distributionLog) {
        if (!distributionLog.length) {
            return "配布対象はありませんでした";
        }

        const summaryMap = new Map();

        for (const row of distributionLog) {
            const key = `${row.playerId}:${row.terrain}`;
            summaryMap.set(key, (summaryMap.get(key) || 0) + row.amount);
        }

        const lines = [];
        for (const [key, amount] of summaryMap.entries()) {
            const [playerId, terrain] = key.split(":");
            const player = getPlayerById(Number(playerId));
            lines.push(`${player.name}: ${RESOURCE_LABELS[terrain]} +${amount}`);
        }

        return lines.join("\n");
    }

    // 役割: プレイヤーの総資源枚数を返す
    function getPlayerTotalResources(player) {
        if (!player) return 0;
        return RESOURCE_KEYS.reduce((sum, key) => sum + (player.resources[key] || 0), 0);
    }

    // 役割: 盗賊移動先 hex に隣接し、かつ奪取対象になれるプレイヤー一覧を返す
    // 使用: 盗賊移動直後の奪取処理分岐時
    // 入出力: hexId, robberPlayerId を受け取り、candidatePlayerIds 配列を返す
    // 関連: resolveRobberStealAfterMove / openRobberStealModal / getPlayerTotalResources
    function getRobberVictimCandidates(hexId, robberPlayerId) {
        const hex = boardData.hexes.find((row) => row.id === hexId);
        if (!hex) return [];

        const candidateIds = new Set();

        hex.vertexIds.forEach((vertexId) => {
            const vertexState = gameState.boardState.vertexStates[vertexId];
            if (!vertexState) return;
            if (vertexState.ownerPlayerId === null) return;
            if (vertexState.buildingType === null) return;
            if (vertexState.ownerPlayerId === robberPlayerId) return;

            const player = getPlayerById(vertexState.ownerPlayerId);
            if (!player) return;
            if (getPlayerTotalResources(player) <= 0) return;

            candidateIds.add(player.id);
        });

        return Array.from(candidateIds);
    }

    // 役割: プレイヤー資源から 1 枚単位の重み付きランダムで資源キーを選ぶ
    function pickRandomResourceKey(player) {
        const pool = [];

        RESOURCE_KEYS.forEach((key) => {
            const count = player.resources[key] || 0;
            for (let i = 0; i < count; i++) {
                pool.push(key);
            }
        });

        if (!pool.length) return null;
        const index = Math.floor(Math.random() * pool.length);
        return pool[index];
    }

    // 役割: CPU 用の盗賊奪取候補をランダムに 1 人選ぶ
    function chooseRobberVictimCandidate(candidatePlayerIds) {
        if (!Array.isArray(candidatePlayerIds) || !candidatePlayerIds.length) {
            return null;
        }

        const index = Math.floor(Math.random() * candidatePlayerIds.length);
        return candidatePlayerIds[index];
    }

    // 役割: 奪取相手選択モーダル状態を閉じてリセットする
    function closeRobberStealModal() {
        robberStealState.active = false;
        robberStealState.robberPlayerId = null;
        robberStealState.candidatePlayerIds = [];
        robberStealState.cpuSuggestedPlayerId = null;
        renderRobberStealModal();
    }

    // 役割: 選ばれた相手からランダム資源 1 枚を奪って反映する
    // 使用: 奪取相手選択後、または候補 1 人時の自動確定時
    // 入出力: targetPlayerId, robberPlayerId を受け取り、資源数を更新して alert 表示する
    // 関連: pickRandomResourceKey / closeRobberStealModal / resolveRobberStealAfterMove
    function executeRobberSteal(targetPlayerId, robberPlayerId) {
        const fromPlayer = getPlayerById(targetPlayerId);
        const toPlayer = getPlayerById(robberPlayerId);
        if (!fromPlayer || !toPlayer) {
            closeRobberStealModal();
            return;
        }

        const resourceKey = pickRandomResourceKey(fromPlayer);
        closeRobberStealModal();

        if (!resourceKey) {
            renderAll();
            return;
        }

        fromPlayer.resources[resourceKey] -= 1;
        toPlayer.resources[resourceKey] = (toPlayer.resources[resourceKey] || 0) + 1;

        saveGame();
        renderAll();
        alert(`${fromPlayer.name} から ${RESOURCE_LABELS[resourceKey]} を奪いました`);
    }

    // 役割: 盗賊奪取相手選択モーダルを開き、CPU 手番なら候補 1 人を強調する
    // 使用: 盗賊移動後に奪取候補が複数いる時
    // 入出力: candidatePlayerIds, robberPlayerId を受け取り、robberStealState と DOM を更新する
    // 関連: chooseRobberVictimCandidate / renderRobberStealModal / resolveRobberStealAfterMove
    function openRobberStealModal(candidatePlayerIds, robberPlayerId) {
        const robberPlayer = getPlayerById(robberPlayerId);
        robberStealState.active = true;
        robberStealState.robberPlayerId = robberPlayerId;
        robberStealState.candidatePlayerIds = [...candidatePlayerIds];
        robberStealState.cpuSuggestedPlayerId = robberPlayer?.isCpu
            ? chooseRobberVictimCandidate(candidatePlayerIds)
            : null;

        if (robberPlayer?.isCpu) {
            console.log("[CatanCPU] robber victim candidates", robberStealState.candidatePlayerIds);
            console.log("[CatanCPU] robber victim suggested candidate", robberStealState.cpuSuggestedPlayerId);
        }

        renderRobberStealModal();
    }

    // 役割: 奪取相手選択モーダルの中身と開閉状態を描画する
    function renderRobberStealModal() {
        const modal = document.getElementById("robberStealModal");
        const body = document.getElementById("robberStealModalBody");
        if (!modal || !body) return;

        if (!robberStealState.active) {
            modal.classList.add("hidden");
            body.innerHTML = "";
            return;
        }

        body.innerHTML = `
            <div class="robber-steal-actions">
                ${robberStealState.candidatePlayerIds.map((playerId) => {
                    const player = getPlayerById(playerId);
                    const isCpuSuggested = robberStealState.cpuSuggestedPlayerId === playerId;
                    return `
                        <button
                            class="btn robber-steal-btn ${isCpuSuggested ? "is-cpu-suggested" : ""}"
                            data-action="robber-steal-target"
                            data-player-id="${playerId}"
                        >
                            <span>${player.name} から奪う</span>
                            ${isCpuSuggested ? '<span class="robber-steal-cpu-badge">CPU候補</span>' : ""}
                        </button>
                    `;
                }).join("")}
            </div>
        `;

        modal.classList.remove("hidden");

        body.querySelectorAll('[data-action="robber-steal-target"]').forEach((btn) => {
            btn.addEventListener("click", () => {
                executeRobberSteal(Number(btn.dataset.playerId), robberStealState.robberPlayerId);
            });
        });

    // 役割: 盗賊移動後に候補人数ごとの奪取フローへ分岐する
    // 使用: moveRobberToHex の直後
    // 入出力: hexId を受け取り、候補 0 / 1 / 複数に応じて処理を進める
    // 関連: getRobberVictimCandidates / executeRobberSteal / openRobberStealModal
    function resolveRobberStealAfterMove(hexId) {
        const robberPlayerId = gameState.robberMode?.playerId ?? gameState.activePlayerId;
        const candidatePlayerIds = getRobberVictimCandidates(hexId, robberPlayerId);

        endRobberMove();

        if (!candidatePlayerIds.length) {
            return;
        }

        if (candidatePlayerIds.length === 1) {
            executeRobberSteal(candidatePlayerIds[0], robberPlayerId);
            return;
        }

        openRobberStealModal(candidatePlayerIds, robberPlayerId);
    }

    // 使用: サイコロパネルの「資源配布」ボタン押下時
    // 入出力: 引数なしで、pending 状態を確認して配布・保存・再描画する
    // 関連: distributeResourcesByTotal / summarizeDistributionLog / renderDicePanel
    function distributeResourcesForCurrentRoll() {
        const total = gameState.dice?.total;

        if (total === null || typeof total !== "number") {
            alert("先にサイコロを振ってください");
            return;
        }

        if (!gameState.dice.distributionPending) {
            alert("この出目の資源配布はすでに完了しています");
            return;
        }

        const distributionLog = distributeResourcesByTotal(total);

        gameState.dice.distributionPending = false;

        saveGame();
        renderPlayerPanels();
        renderDicePanel();

        alert(`出目 ${total} の資源配布を行いました\n\n${summarizeDistributionLog(distributionLog)}`);
    }

    // 入出力: reason, playerId を受け取り、robberMode を更新して再描画する
    // 関連: handleDiceRolled / useDevelopmentCard / endRobberMove / renderBoard
    function beginRobberMove(reason = "manual", playerId = null) {
        gameState.robberMode.active = true;
        gameState.robberMode.reason = reason;
        gameState.robberMode.playerId = playerId;

        saveGame();
        renderAll();
    }

    // 役割: robberMode を終了する
    function endRobberMove() {
        gameState.robberMode.active = false;
        gameState.robberMode.reason = null;
        gameState.robberMode.playerId = null;

        saveGame();
        renderAll();
    }

    // 役割: 盗賊位置を新しい hex へ移し、その後の奪取処理へ進める
    function moveRobberToHex(hexId) {
        const targetHexState = getHexStateById(hexId);
        if (!targetHexState) return;

        for (const hexState of gameState.boardState.hexStates) {
            hexState.robber = false;
        }

        targetHexState.robber = true;
        saveGame();
        resolveRobberStealAfterMove(hexId);
    }

    // 役割: robberMode 中の hex クリックを盗賊移動として処理する
    function handleHexClick(hexId) {
        if (inspectModeState.active) {
            return;
        }

        if (!gameState.robberMode?.active) {
            return;
        }

        const currentHexState = getHexStateById(hexId);
        if (!currentHexState) return;

        if (currentHexState.robber) {
            return;
        }

        moveRobberToHex(hexId);
    }

    // 役割: サイコロ 2 個を振って dice 状態を更新する
    function rollDice() {
        const die1 = rollDie();
        const die2 = rollDie();
        const total = die1 + die2;

        gameState.dice.die1 = die1;
        gameState.dice.die2 = die2;
        gameState.dice.total = total;

        handleDiceRolled(total, die1, die2);

        saveGame();
        renderDicePanel();
    }

 // 役割: 手動補助用に vertex の建物状態をトグルする
 function handleVertexClick(vertexId) {
  if (inspectModeState.active) return;
  const vertexState = gameState.boardState.vertexStates[vertexId];
  const player = getCurrentPlayer();
  if (!player) return;

  const prevType = vertexState.buildingType;
  const prevOwner = vertexState.ownerPlayerId;

  // なし → 開拓地
  if (prevType === null) {
    if (player.remainingPieces.settlements <= 0) {
      alert("このプレイヤーの開拓地コマは残っていません");
      return;
    }

    vertexState.ownerPlayerId = player.id;
    vertexState.buildingType = "settlement";
    player.remainingPieces.settlements -= 1;

    recomputePoints();
    saveGame();
    renderAll();
    return;
  }

  // 他人の建物は触れない
  if (prevOwner !== player.id) {
    return;
  }

  // 開拓地 → 都市
  if (prevType === "settlement") {
    if (player.remainingPieces.cities <= 0) {
      alert("このプレイヤーの都市コマは残っていません");
      return;
    }

    vertexState.buildingType = "city";
    player.remainingPieces.cities -= 1;
    player.remainingPieces.settlements += 1;

    recomputePoints();
    saveGame();
    renderAll();
    return;
  }

  // 都市 → なし
  if (prevType === "city") {
    vertexState.ownerPlayerId = null;
    vertexState.buildingType = null;
    player.remainingPieces.cities += 1;

    recomputePoints();
    saveGame();
    renderAll();
  }
}

  if (inspectModeState.active) return;
  const edgeState = gameState.boardState.edgeStates[edgeId];
  const player = getCurrentPlayer();
  if (!player) return;

  // なし → 置く
  if (edgeState.ownerPlayerId === null) {
    if (player.remainingPieces.roads <= 0) {
      alert("このプレイヤーの街道コマは残っていません");
      return;
    }

    edgeState.ownerPlayerId = player.id;
    player.remainingPieces.roads -= 1;

    saveGame();
    renderAll();
    return;
  }

  // 自分の道なら削除
  if (edgeState.ownerPlayerId === player.id) {
    edgeState.ownerPlayerId = null;
    player.remainingPieces.roads += 1;

    saveGame();
    renderAll();
  }
}
